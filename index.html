<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrantGuard v2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; }
        .navbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 1rem; padding: 1rem 2rem; background: #0a0a0f; border-bottom: 1px solid #2a2a3a; }
        .nav-logo { font-size: 1.4rem; font-weight: 700; }
        .nav-links { display: flex; gap: 2rem; align-items: center; margin-left: auto; }
        .nav-links a { font-weight: 700; font-size: .9rem; color: #888; cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { color: #15BCDF; }
        .wallet-btn { border: 1px solid #15BCDF; color: #15BCDF; background: transparent; padding: .5rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 700; }
        .wallet-btn.connected { background: #52e0a1; border-color: #52e0a1; color: #000; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        .page { display: none; }
        .page.active { display: block; }
        .card { background: #161620; border: 1px solid #2a2a3a; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        h1 { font-size: 1.8rem; margin-bottom: .5rem; }
        h2, h3 { color: #15BCDF; margin-bottom: 1rem; }
        .subtitle { color: #888; margin-bottom: 2rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        label { font-size: .75rem; color: #888; display: block; margin-bottom: .25rem; text-transform: uppercase; }
        input, textarea { width: 100%; background: #0a0a0f; border: 1px solid #2a2a3a; color: #e0e0e0; padding: .6rem; border-radius: 8px; font-size: .9rem; font-family: inherit; }
        textarea { resize: vertical; min-height: 80px; }
        .row { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1rem; }
        .btn { border: 1px solid #15BCDF; color: #15BCDF; background: transparent; padding: .6rem 1.2rem; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: .85rem; }
        .btn:hover { background: #15BCDF; color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-p { background: #15BCDF; color: #fff; }
        .btn-s { border-color: #52e0a1; color: #52e0a1; }
        .btn-d { border-color: #ff5c7a; color: #ff5c7a; }
        .btn-w { border-color: #ffd93d; color: #ffd93d; }
        .note { border-radius: 8px; padding: .75rem; margin-bottom: 1rem; font-size: .85rem; display: none; }
        .note.show { display: block; }
        .note.err { background: rgba(255,92,122,.1); color: #ff5c7a; }
        .note.ok { background: rgba(82,224,161,.1); color: #52e0a1; }
        .grant-card { cursor: pointer; }
        .grant-card:hover { border-color: #15BCDF; }
        .grant-card h3 { color: #15BCDF; margin-bottom: .5rem; }
        .grant-card .meta { color: #888; font-size: .85rem; margin-top: .5rem; }
        .loading { display: none; text-align: center; padding: 2rem; }
        .loading.active { display: block; }
        .spinner { width: 40px; height: 40px; border: 3px solid #2a2a3a; border-top-color: #15BCDF; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-logo">GrantGuard v2</div>
    <div class="nav-links">
        <a onclick="go('grants')" id="nav-grants" class="active">Grants</a>
        <a onclick="go('create')" id="nav-create">Create Grant</a>
        <a onclick="go('status')" id="nav-status">Check Status</a>
    </div>
    <button class="wallet-btn" id="walletBtn" onclick="connect()">Connect Wallet</button>
</nav>

<div class="container">
    <div id="page-grants" class="page active">
        <h1>Available Grants</h1>
        <p class="subtitle">Click a grant to view details and apply</p>
        <div id="grants-list"><p style="color:#888">Connect wallet to view grants</p></div>
    </div>
    <div id="page-detail" class="page"><div id="detail-content"></div></div>
    <div id="page-create" class="page">
        <h1>Create Grant</h1>
        <p class="subtitle">Publish a new grant opportunity</p>
        <form id="create-form">
            <div class="grid">
                <div><label>Grant ID *</label><input type="text" id="grant-id" required></div>
                <div><label>Deadline</label><input type="date" id="grant-deadline"></div>
            </div>
            <div><label>Grant Name *</label><input type="text" id="grant-name" required></div>
            <div><label>Description *</label><textarea id="grant-description" required></textarea></div>
            <div><label>Eligibility Criteria *</label><textarea id="grant-eligibility" required></textarea></div>
            <div><label>Evaluation Criteria *</label><textarea id="grant-criteria" required></textarea></div>
            <div><label>Budget Rules</label><textarea id="grant-budget"></textarea></div>
            <div><label>Required Evidence</label><textarea id="grant-evidence"></textarea></div>
            <button type="submit" class="btn btn-p">Publish Grant</button>
        </form>
        <div id="create-result" style="margin-top:1rem"></div>
    </div>
    <div id="page-status" class="page">
        <h1>Check Application Status</h1>
        <p class="subtitle">Enter Application ID (e.g., app_0)</p>
        <div class="grid"><div><label>Application ID</label><input type="text" id="check-app-id" placeholder="app_0"></div></div>
        <button class="btn btn-p" onclick="checkStatus()" style="margin-top:1rem">Check Status</button>
        <div id="status-result"></div>
    </div>
    <div id="loading" class="loading"><div class="spinner"></div><p id="loading-text">Loading...</p></div>
    <div id="note" class="note"></div>
</div>

<script src="viem-iife.js"></script>
<script>
const CONTRACT = '0x671990450Bab8f89144F50B6A619c6382E824172';
const CHAIN = '0x107d';
const RPC = 'https://studio-next.genlayer.com/api';
const EXPLORER = 'https://explorer-studio-next.genlayer.com/address/' + CONTRACT;
let acct = null;
let isProcessing = false;

const ABI = [
    { name: 'create_grant', type: 'function', stateMutability: 'nonpayable', inputs: [{ name: 'grant_id', type: 'string' }, { name: 'name', type: 'string' }, { name: 'description', type: 'string' }, { name: 'eligibility', type: 'string' }, { name: 'criteria', type: 'string' }, { name: 'budget_rules', type: 'string' }, { name: 'required_evidence', type: 'string' }, { name: 'deadline', type: 'string' }], outputs: [{ type: 'string' }] },
    { name: 'fund_grant', type: 'function', stateMutability: 'payable', inputs: [{ name: 'grant_id', type: 'string' }], outputs: [{ type: 'string' }] },
    { name: 'submit_application', type: 'function', stateMutability: 'nonpayable', inputs: [{ name: 'grant_id', type: 'string' }, { name: 'project_name', type: 'string' }, { name: 'project_description', type: 'string' }, { name: 'team_info', type: 'string' }, { name: 'requested_amount', type: 'uint256' }, { name: 'website', type: 'string' }, { name: 'github_url', type: 'string' }, { name: 'evidence_urls', type: 'string' }, { name: 'additional_info', type: 'string' }], outputs: [{ type: 'string' }] },
    { name: 'evaluate_application', type: 'function', stateMutability: 'nonpayable', inputs: [{ name: 'app_id', type: 'string' }], outputs: [{ type: 'string' }] },
    { name: 'release_funds', type: 'function', stateMutability: 'nonpayable', inputs: [{ name: 'app_id', type: 'string' }], outputs: [{ type: 'string' }] },
    { name: 'cancel_grant', type: 'function', stateMutability: 'nonpayable', inputs: [{ name: 'grant_id', type: 'string' }], outputs: [{ type: 'bool' }] },
    { name: 'get_grant', type: 'function', stateMutability: 'view', inputs: [{ name: 'grant_id', type: 'string' }], outputs: [{ type: 'string' }] },
    { name: 'get_application', type: 'function', stateMutability: 'view', inputs: [{ name: 'app_id', type: 'string' }], outputs: [{ type: 'string' }] },
    { name: 'get_stats', type: 'function', stateMutability: 'view', inputs: [], outputs: [{ type: 'string' }] }
];

function note(msg, type) {
    var el = document.getElementById('note');
    el.textContent = msg;
    el.className = 'note show' + (type ? ' ' + type : '');
    setTimeout(function() { el.className = 'note'; }, 5000);
}

function loading(text) { document.getElementById('loading').classList.add('active'); document.getElementById('loading-text').textContent = text || 'Loading...'; }
function loaded() { document.getElementById('loading').classList.remove('active'); }

function go(page) {
    var pages = document.querySelectorAll('.page');
    for (var i = 0; i < pages.length; i++) pages[i].classList.remove('active');
    var navs = document.querySelectorAll('.nav-links a');
    for (var i = 0; i < navs.length; i++) navs[i].classList.remove('active');
    document.getElementById('page-' + page).classList.add('active');
    document.getElementById('nav-' + page).classList.add('active');
    if (page === 'grants' && acct) loadGrants();
}

async function rpc(method, params) {
    var r = await fetch(RPC, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ jsonrpc:'2.0', id: Date.now(), method, params }) });
    var j = await r.json();
    if (j.error) throw new Error(j.error.message);
    return j.result;
}

async function connect() {
    if (isProcessing) return;
    if (acct) {
        acct = null;
        document.getElementById('walletBtn').textContent = 'Connect Wallet';
        document.getElementById('walletBtn').classList.remove('connected');
        document.getElementById('grants-list').innerHTML = '<p style="color:#888">Connect wallet to view grants</p>';
        return;
    }
    if (!window.ethereum) { note('MetaMask not detected!', 'err'); return; }
    if (!window.viem) { note('viem not loaded!', 'err'); return; }
    isProcessing = true;
    try {
        var accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        if (!accounts || !accounts.length) throw new Error('No accounts');
        acct = accounts[0];
        var chain = await window.ethereum.request({ method: 'eth_chainId' });
        if (parseInt(chain, 16) !== 61997) {
            try { await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{ chainId: CHAIN, chainName: 'GenLayer Studio Next', rpcUrls: [RPC], nativeCurrency: { name: 'GEN', symbol: 'GEN', decimals: 18 } }] }); } catch(e) {}
            await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CHAIN }] });
        }
        document.getElementById('walletBtn').textContent = '✓ ' + acct.slice(0,6) + '...' + acct.slice(-4);
        document.getElementById('walletBtn').classList.add('connected');
        note('Connected!', 'ok');
        loadGrants();
    } catch (err) { note('Error: ' + err.message, 'err'); }
    isProcessing = false;
}

async function sendTx(fn, args, value) {
    var abiItem = ABI.find(function(f) { return f.name === fn; });
    var data = window.viem.encodeFunctionData({ abi: [abiItem], functionName: fn, args });
    return await window.ethereum.request({ method: 'eth_sendTransaction', params: [{ from: acct, to: CONTRACT, data, value: value ? '0x' + value.toString(16) : '0x0' }] });
}

async function loadGrants() {
    var listEl = document.getElementById('grants-list');
    listEl.innerHTML = '<p style="color:#888">Loading grants...</p>';
    try {
        var selector = window.viem.encodeFunctionData({ abi: [{ name: 'get_stats', type: 'function', stateMutability: 'view', inputs: [], outputs: [{ type: 'string' }] }], functionName: 'get_stats', args: [] });
        var result = await rpc('eth_call', [{ to: CONTRACT, data: selector }, 'latest']);
        var decoded = window.viem.decodeFunctionResult({ abi: [{ name: 'get_stats', type: 'function', stateMutability: 'view', inputs: [], outputs: [{ type: 'tuple', components: [{ name: 'total_grants', type: 'uint256' }, { name: 'total_applications', type: 'uint256' }] }] }], functionName: 'get_stats', data: result });
        var total = Number(decoded[0] || decoded.total_grants);
        if (total === 0) { listEl.innerHTML = '<p style="color:#888">No grants found</p>'; return; }
        
        var found = [];
        var ids = ['test-grant-1', 'test-grant-2', 'test-grant-3', 'grant_0', 'grant_1', 'grant_2'];
        for (var i = 0; i < ids.length; i++) {
            try {
                var sel = window.viem.encodeFunctionData({ abi: [{ name: 'get_grant', type: 'function', stateMutability: 'view', inputs: [{ name: 'grant_id', type: 'string' }], outputs: [{ type: 'string' }] }], functionName: 'get_grant', args: [ids[i]] });
                var res = await rpc('eth_call', [{ to: CONTRACT, data: sel }, 'latest']);
                if (res && res !== '0x') {
                    found.push({ id: ids[i], name: ids[i] });
                }
            } catch(e) {}
        }
        
        if (found.length === 0) { listEl.innerHTML = '<p style="color:#888">No grants found</p>'; return; }
        listEl.innerHTML = found.map(function(g) {
            return '<div class="card grant-card" onclick="viewGrant(\'' + g.id + '\')"><h3>' + g.name + '</h3><div class="meta">ID: ' + g.id + ' · Click to view</div></div>';
        }).join('');
    } catch (e) { listEl.innerHTML = '<p style="color:#888">Error: ' + e.message + '</p>'; }
}

function viewGrant(id) {
    go('detail');
    document.getElementById('detail-content').innerHTML = 
        '<h2>' + id + '</h2>' +
        '<p><a href="' + EXPLORER + '" target="_blank">View on Explorer</a></p>' +
        '<div class="row"><button class="btn btn-w" onclick="fundGrant(\'' + id + '\')">Fund Grant</button></div>' +
        '<div id="fund-result"></div>' +
        '<h3 style="margin-top:1rem">Apply for this Grant</h3>' +
        '<form id="apply-form">' +
            '<div class="grid"><div><label>Project Name *</label><input type="text" id="app-name" required></div><div><label>Amount (wei)</label><input type="text" id="app-amount" placeholder="500000000000000000"></div></div>' +
            '<div><label>Description *</label><textarea id="app-description" required></textarea></div>' +
            '<div><label>Team Info</label><textarea id="app-team"></textarea></div>' +
            '<div class="grid"><div><label>Website</label><input type="text" id="app-website"></div><div><label>GitHub URL</label><input type="text" id="app-github"></div></div>' +
            '<div><label>Evidence URLs *</label><input type="text" id="app-evidence" required></div>' +
            '<div><label>Additional Info</label><textarea id="app-additional"></textarea></div>' +
            '<button type="submit" class="btn btn-p">Submit Application</button>' +
        '</form>' +
        '<div id="apply-result"></div>';
    document.getElementById('apply-form').onsubmit = async function(e) {
        e.preventDefault();
        if (isProcessing) return;
        isProcessing = true;
        loading('Submitting...');
        try {
            var hash = await sendTx('submit_application', [id, document.getElementById('app-name').value, document.getElementById('app-description').value, document.getElementById('app-team').value || '', BigInt(document.getElementById('app-amount').value || '0'), document.getElementById('app-website').value || '', document.getElementById('app-github').value || '', document.getElementById('app-evidence').value, document.getElementById('app-additional').value || ''], 0n);
            document.getElementById('apply-result').innerHTML = '<div class="note show ok">TX: ' + hash + '</div>';
        } catch (e) { note('Error: ' + e.message, 'err'); }
        isProcessing = false;
        loaded();
    };
}

async function fundGrant(id) {
    if (isProcessing) return;
    isProcessing = true;
    loading('Funding...');
    try {
        var hash = await sendTx('fund_grant', [id], 1000000000000000000n);
        document.getElementById('fund-result').innerHTML = '<div class="note show ok">TX: ' + hash + '</div>';
    } catch (e) { note('Error: ' + e.message, 'err'); }
    isProcessing = false;
    loaded();
}

document.getElementById('create-form').onsubmit = async function(e) {
    e.preventDefault();
    if (isProcessing) return;
    isProcessing = true;
    loading('Publishing...');
    try {
        var hash = await sendTx('create_grant', [document.getElementById('grant-id').value, document.getElementById('grant-name').value, document.getElementById('grant-description').value, document.getElementById('grant-eligibility').value, document.getElementById('grant-criteria').value, document.getElementById('grant-budget').value, document.getElementById('grant-evidence').value, document.getElementById('grant-deadline').value], 0n);
        document.getElementById('create-result').innerHTML = '<div class="note show ok">TX: ' + hash + '</div>';
    } catch (e) { note('Error: ' + e.message, 'err'); }
    isProcessing = false;
    loaded();
};

async function checkStatus() {
    var appId = document.getElementById('check-app-id').value.trim();
    if (!appId) { note('Enter App ID', 'warn'); return; }
    loading('Checking...');
    try {
        var selector = window.viem.encodeFunctionData({ abi: [{ name: 'get_application', type: 'function', stateMutability: 'view', inputs: [{ name: 'app_id', type: 'string' }], outputs: [{ type: 'string' }] }], functionName: 'get_application', args: [appId] });
        var result = await rpc('eth_call', [{ to: CONTRACT, data: selector }, 'latest']);
        var html = '<div class="card"><h2>App: ' + appId + '</h2><pre>' + result + '</pre></div>';
        html += '<button class="btn btn-p" onclick="evaluateApp(\'' + appId + '\')" style="margin-top:1rem">Evaluate</button>';
        html += '<button class="btn btn-s" onclick="releaseFunds(\'' + appId + '\')" style="margin-top:1rem;margin-left:.5rem">Release Funds</button>';
        document.getElementById('status-result').innerHTML = html;
    } catch (e) { note('Error: ' + e.message, 'err'); }
    loaded();
}

async function evaluateApp(appId) {
    if (isProcessing) return;
    isProcessing = true;
    loading('Evaluating...');
    try {
        var hash = await sendTx('evaluate_application', [appId], 0n);
        note('Started! TX: ' + hash, 'ok');
    } catch (e) { note('Error: ' + e.message, 'err'); }
    isProcessing = false;
    loaded();
}

async function releaseFunds(appId) {
    if (isProcessing) return;
    isProcessing = true;
    loading('Releasing...');
    try {
        var hash = await sendTx('release_funds', [appId], 0n);
        note('Released! TX: ' + hash, 'ok');
    } catch (e) { note('Error: ' + e.message, 'err'); }
    isProcessing = false;
    loaded();
}

if (window.ethereum) {
    window.ethereum.on('accountsChanged', function(a) { if (!a.length) { acct = null; document.getElementById('walletBtn').textContent = 'Connect Wallet'; document.getElementById('walletBtn').classList.remove('connected'); document.getElementById('grants-list').innerHTML = '<p style="color:#888">Connect wallet to view grants</p>'; } });
}
</script>
</body>
</html>
