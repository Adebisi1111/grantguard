<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrantGuard v2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 1.8rem; margin-bottom: 1rem; }
        h2 { color: #15BCDF; margin: 1.5rem 0 1rem; }
        .section { background: #161620; border: 1px solid #2a2a3a; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        label { font-size: .85rem; color: #888; display: block; margin-bottom: .25rem; }
        input, textarea { width: 100%; background: #0a0a0f; border: 1px solid #2a2a3a; color: #e0e0e0; padding: .6rem; border-radius: 8px; font-size: .9rem; margin-bottom: .75rem; font-family: inherit; }
        textarea { resize: vertical; min-height: 60px; }
        .btn { border: 1px solid #15BCDF; color: #15BCDF; background: transparent; padding: .6rem 1.2rem; border-radius: 8px; cursor: pointer; font-weight: 700; margin-right: .5rem; }
        .btn:hover { background: #15BCDF; color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-p { background: #15BCDF; color: #fff; }
        .note { border-radius: 8px; padding: .75rem; margin: 1rem 0; font-size: .85rem; }
        .note.err { background: rgba(255,92,122,.1); color: #ff5c7a; }
        .note.ok { background: rgba(82,224,161,.1); color: #52e0a1; }
        .note.warn { background: rgba(255,217,61,.1); color: #ffd93d; }
        .wallet-status { position: fixed; top: 1rem; right: 1rem; padding: .5rem 1rem; border-radius: 8px; font-size: .85rem; font-weight: 700; }
        .wallet-status.connected { background: #52e0a1; color: #000; }
        .wallet-status.disconnected { background: #ff5c7a; color: #fff; }
        .grant-item { background: #0a0a0f; border: 1px solid #2a2a3a; border-radius: 8px; padding: 1rem; margin-bottom: .5rem; cursor: pointer; }
        .grant-item:hover { border-color: #15BCDF; }
        pre { background: #0a0a0f; padding: 1rem; border-radius: 8px; overflow-x: auto; font-size: .8rem; }
    </style>
</head>
<body>
<div class="container">
    <h1>GrantGuard v2</h1>
    
    <div id="walletStatus" class="wallet-status disconnected">Not Connected</div>
    
    <button class="btn btn-p" id="btnConnect" onclick="connectWallet()">Connect Wallet</button>
    
    <div id="note" class="note" style="display:none"></div>
    
    <!-- Grants Section -->
    <div class="section">
        <h2>Available Grants</h2>
        <div id="grantsList">
            <p style="color:#888">Connect wallet to view grants</p>
        </div>
    </div>
    
    <!-- Create Grant Section -->
    <div class="section">
        <h2>Create Grant</h2>
        <label>Grant ID</label>
        <input type="text" id="grantId" value="test-grant-99">
        <label>Grant Name</label>
        <input type="text" id="grantName" value="Test Grant">
        <label>Description</label>
        <textarea id="grantDesc">Test Description</textarea>
        <label>Eligibility Criteria</label>
        <textarea id="grantElig">All developers</textarea>
        <label>Evaluation Criteria</label>
        <textarea id="grantCriteria">Technical merit</textarea>
        <label>Budget Rules</label>
        <input type="text" id="grantBudget" value="Max 1000 GEN">
        <label>Required Evidence</label>
        <input type="text" id="grantEvidence" value="GitHub repo">
        <label>Deadline</label>
        <input type="date" id="grantDeadline" value="2026-12-31">
        <button class="btn btn-p" id="btnCreate" onclick="createGrant()">Create Grant</button>
        <div id="createResult"></div>
    </div>
    
    <!-- Apply Section -->
    <div class="section">
        <h2>Apply for Grant</h2>
        <label>Grant ID</label>
        <input type="text" id="applyGrantId" value="test-grant-1">
        <label>Project Name</label>
        <input type="text" id="applyName" value="My Project">
        <label>Project Description</label>
        <textarea id="applyDesc">A test project</textarea>
        <label>Team Info</label>
        <input type="text" id="applyTeam" value="Solo developer">
        <label>Requested Amount (wei)</label>
        <input type="text" id="applyAmount" value="500000000000000000">
        <label>Website</label>
        <input type="text" id="applyWebsite" value="https://example.com">
        <label>GitHub URL</label>
        <input type="text" id="applyGithub" value="https://github.com/test">
        <label>Evidence URLs</label>
        <input type="text" id="applyEvidence" value="https://github.com/test">
        <label>Additional Info</label>
        <textarea id="applyAdditional">Test info</textarea>
        <button class="btn btn-p" id="btnApply" onclick="submitApplication()">Submit Application</button>
        <div id="applyResult"></div>
    </div>
    
    <!-- Check Status Section -->
    <div class="section">
        <h2>Check Application Status</h2>
        <label>Application ID</label>
        <input type="text" id="checkAppId" value="app_0">
        <button class="btn btn-p" id="btnCheck" onclick="checkStatus()">Check Status</button>
        <button class="btn" id="btnEval" onclick="evaluateApp()">Evaluate</button>
        <button class="btn" id="btnRelease" onclick="releaseFunds()">Release Funds</button>
        <div id="statusResult" style="margin-top:1rem"></div>
    </div>
</div>

<script src="viem-iife.js"></script>
<script>
const CONTRACT = '0x671990450Bab8f89144F50B6A619c6382E824172';
const CHAIN = '0x107d';
const RPC = 'https://studio-next.genlayer.com/api';
const EXPLORER = 'https://explorer-studio-next.genlayer.com/address/' + CONTRACT;

const ABI = [
    { name: 'create_grant', type: 'function', stateMutability: 'nonpayable', inputs: [{ name: 'grant_id', type: 'string' }, { name: 'name', type: 'string' }, { name: 'description', type: 'string' }, { name: 'eligibility', type: 'string' }, { name: 'criteria', type: 'string' }, { name: 'budget_rules', type: 'string' }, { name: 'required_evidence', type: 'string' }, { name: 'deadline', type: 'string' }], outputs: [{ type: 'string' }] },
    { name: 'fund_grant', type: 'function', stateMutability: 'payable', inputs: [{ name: 'grant_id', type: 'string' }], outputs: [{ type: 'string' }] },
    { name: 'submit_application', type: 'function', stateMutability: 'nonpayable', inputs: [{ name: 'grant_id', type: 'string' }, { name: 'project_name', type: 'string' }, { name: 'project_description', type: 'string' }, { name: 'team_info', type: 'string' }, { name: 'requested_amount', type: 'uint256' }, { name: 'website', type: 'string' }, { name: 'github_url', type: 'string' }, { name: 'evidence_urls', type: 'string' }, { name: 'additional_info', type: 'string' }], outputs: [{ type: 'string' }] },
    { name: 'evaluate_application', type: 'function', stateMutability: 'nonpayable', inputs: [{ name: 'app_id', type: 'string' }], outputs: [{ type: 'string' }] },
    { name: 'release_funds', type: 'function', stateMutability: 'nonpayable', inputs: [{ name: 'app_id', type: 'string' }], outputs: [{ type: 'string' }] },
    { name: 'cancel_grant', type: 'function', stateMutability: 'nonpayable', inputs: [{ name: 'grant_id', type: 'string' }], outputs: [{ type: 'bool' }] },
    { name: 'get_grant', type: 'function', stateMutability: 'view', inputs: [{ name: 'grant_id', type: 'string' }], outputs: [{ type: 'string' }] },
    { name: 'get_application', type: 'function', stateMutability: 'view', inputs: [{ name: 'app_id', type: 'string' }], outputs: [{ type: 'string' }] },
    { name: 'get_stats', type: 'function', stateMutability: 'view', inputs: [], outputs: [{ type: 'string' }] }
];

var acct = null;

function showNote(msg, type) {
    var el = document.getElementById('note');
    el.textContent = msg;
    el.className = 'note ' + (type || 'warn');
    el.style.display = 'block';
    setTimeout(function() { el.style.display = 'none'; }, 8000);
}

async function rpc(method, params) {
    var r = await fetch(RPC, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ jsonrpc:'2.0', id: Date.now(), method, params }) });
    var j = await r.json();
    if (j.error) throw new Error(j.error.message);
    return j.result;
}

async function connectWallet() {
    if (acct) {
        acct = null;
        document.getElementById('walletStatus').textContent = 'Not Connected';
        document.getElementById('walletStatus').className = 'wallet-status disconnected';
        document.getElementById('btnConnect').textContent = 'Connect Wallet';
        document.getElementById('grantsList').innerHTML = '<p style="color:#888">Connect wallet to view grants</p>';
        return;
    }
    if (!window.ethereum) { showNote('MetaMask not detected!', 'err'); return; }
    if (!window.viem) { showNote('viem not loaded!', 'err'); return; }
    try {
        document.getElementById('btnConnect').textContent = 'Connecting...';
        document.getElementById('btnConnect').disabled = true;
        showNote('Connecting...', 'warn');
        var accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        if (!accounts || !accounts.length) throw new Error('No accounts');
        acct = accounts[0];
        var chain = await window.ethereum.request({ method: 'eth_chainId' });
        if (parseInt(chain, 16) !== 61997) {
            try { await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{ chainId: CHAIN, chainName: 'GenLayer Studio Next', rpcUrls: [RPC], nativeCurrency: { name: 'GEN', symbol: 'GEN', decimals: 18 } }] }); } catch(e) {}
            await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CHAIN }] });
        }
        document.getElementById('walletStatus').textContent = '✓ ' + acct.slice(0,6) + '...' + acct.slice(-4);
        document.getElementById('walletStatus').className = 'wallet-status connected';
        document.getElementById('btnConnect').textContent = 'Disconnect';
        document.getElementById('btnConnect').disabled = false;
        showNote('Connected!', 'ok');
        loadGrants();
    } catch (err) {
        showNote('Error: ' + err.message, 'err');
        document.getElementById('btnConnect').textContent = 'Connect Wallet';
        document.getElementById('btnConnect').disabled = false;
    }
}

async function sendTx(fn, args, value) {
    var abiItem = ABI.find(function(f) { return f.name === fn; });
    var data = window.viem.encodeFunctionData({ abi: [abiItem], functionName: fn, args });
    return await window.ethereum.request({ method: 'eth_sendTransaction', params: [{ from: acct, to: CONTRACT, data, value: value ? '0x' + value.toString(16) : '0x0' }] });
}

async function loadGrants() {
    var listEl = document.getElementById('grantsList');
    listEl.innerHTML = '<p style="color:#888">Loading grants...</p>';
    try {
        var ids = ['test-grant-1', 'test-grant-2', 'test-grant-3', 'grant_0', 'grant_1', 'grant_2'];
        var found = [];
        for (var i = 0; i < ids.length; i++) {
            try {
                var sel = window.viem.encodeFunctionData({ abi: [{ name: 'get_grant', type: 'function', stateMutability: 'view', inputs: [{ name: 'grant_id', type: 'string' }], outputs: [{ type: 'string' }] }], functionName: 'get_grant', args: [ids[i]] });
                var res = await rpc('eth_call', [{ to: CONTRACT, data: sel }, 'latest']);
                if (res && res !== '0x' && res.length > 40) {
                    found.push({ id: ids[i], name: ids[i] });
                }
            } catch(e) {}
        }
        if (found.length === 0) { listEl.innerHTML = '<p style="color:#888">No grants found</p>'; return; }
        listEl.innerHTML = found.map(function(g) {
            return '<div class="grant-item" onclick="document.getElementById(\'applyGrantId\').value=\'' + g.id + '\'"><strong>' + g.name + '</strong><br><small style="color:#888">ID: ' + g.id + '</small></div>';
        }).join('');
    } catch (e) { listEl.innerHTML = '<p style="color:#888">Error: ' + e.message + '</p>'; }
}

async function createGrant() {
    if (!acct) { showNote('Connect wallet first!', 'err'); return; }
    showNote('Creating grant...', 'warn');
    try {
        var hash = await sendTx('create_grant', [
            document.getElementById('grantId').value,
            document.getElementById('grantName').value,
            document.getElementById('grantDesc').value,
            document.getElementById('grantElig').value,
            document.getElementById('grantCriteria').value,
            document.getElementById('grantBudget').value,
            document.getElementById('grantEvidence').value,
            document.getElementById('grantDeadline').value
        ], 0n);
        document.getElementById('createResult').innerHTML = '<div class="note ok">TX: ' + hash + '</div>';
    } catch (e) {
        document.getElementById('createResult').innerHTML = '<div class="note err">Error: ' + e.message + '</div>';
    }
}

async function submitApplication() {
    if (!acct) { showNote('Connect wallet first!', 'err'); return; }
    showNote('Submitting application...', 'warn');
    try {
        var hash = await sendTx('submit_application', [
            document.getElementById('applyGrantId').value,
            document.getElementById('applyName').value,
            document.getElementById('applyDesc').value,
            document.getElementById('applyTeam').value || '',
            BigInt(document.getElementById('applyAmount').value || '0'),
            document.getElementById('applyWebsite').value || '',
            document.getElementById('applyGithub').value || '',
            document.getElementById('applyEvidence').value,
            document.getElementById('applyAdditional').value || ''
        ], 0n);
        document.getElementById('applyResult').innerHTML = '<div class="note ok">TX: ' + hash + '</div>';
    } catch (e) {
        document.getElementById('applyResult').innerHTML = '<div class="note err">Error: ' + e.message + '</div>';
    }
}

async function checkStatus() {
    if (!acct) { showNote('Connect wallet first!', 'err'); return; }
    var appId = document.getElementById('checkAppId').value.trim();
    if (!appId) { showNote('Enter App ID', 'warn'); return; }
    showNote('Checking status...', 'warn');
    try {
        var sel = window.viem.encodeFunctionData({ abi: [{ name: 'get_application', type: 'function', stateMutability: 'view', inputs: [{ name: 'app_id', type: 'string' }], outputs: [{ type: 'string' }] }], functionName: 'get_application', args: [appId] });
        var result = await rpc('eth_call', [{ to: CONTRACT, data: sel }, 'latest']);
        document.getElementById('statusResult').innerHTML = '<pre>' + result + '</pre>';
    } catch (e) {
        document.getElementById('statusResult').innerHTML = '<div class="note err">Error: ' + e.message + '</div>';
    }
}

async function evaluateApp() {
    if (!acct) { showNote('Connect wallet first!', 'err'); return; }
    var appId = document.getElementById('checkAppId').value.trim();
    if (!appId) { showNote('Enter App ID', 'warn'); return; }
    showNote('Evaluating...', 'warn');
    try {
        var hash = await sendTx('evaluate_application', [appId], 0n);
        document.getElementById('statusResult').innerHTML = '<div class="note ok">TX: ' + hash + '</div>';
    } catch (e) {
        document.getElementById('statusResult').innerHTML = '<div class="note err">Error: ' + e.message + '</div>';
    }
}

async function releaseFunds() {
    if (!acct) { showNote('Connect wallet first!', 'err'); return; }
    var appId = document.getElementById('checkAppId').value.trim();
    if (!appId) { showNote('Enter App ID', 'warn'); return; }
    showNote('Releasing funds...', 'warn');
    try {
        var hash = await sendTx('release_funds', [appId], 0n);
        document.getElementById('statusResult').innerHTML = '<div class="note ok">TX: ' + hash + '</div>';
    } catch (e) {
        document.getElementById('statusResult').innerHTML = '<div class="note err">Error: ' + e.message + '</div>';
    }
}

if (window.ethereum) {
    window.ethereum.on('accountsChanged', function(a) { if (!a.length) { acct = null; document.getElementById('walletStatus').textContent = 'Not Connected'; document.getElementById('walletStatus').className = 'wallet-status disconnected'; document.getElementById('btnConnect').textContent = 'Connect Wallet'; document.getElementById('grantsList').innerHTML = '<p style="color:#888">Connect wallet to view grants</p>'; } });
}
</script>
</body>
</html>
