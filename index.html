<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrantGuard v2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; }
        .navbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 1rem; padding: 1rem 2rem; background: #0a0a0f; border-bottom: 1px solid #2a2a3a; }
        .nav-logo { font-size: 1.4rem; font-weight: 700; }
        .nav-links { display: flex; gap: 2rem; align-items: center; margin-left: auto; }
        .nav-links a { font-weight: 700; font-size: .9rem; color: #888; cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { color: #15BCDF; }
        .wallet-btn { border: 1px solid #15BCDF; color: #15BCDF; background: transparent; padding: .5rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 700; }
        .wallet-btn:hover { background: #15BCDF; color: #fff; }
        .wallet-btn.connected { background: #52e0a1; border-color: #52e0a1; color: #000; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        .page { display: none; }
        .page.active { display: block; }
        .card { background: #161620; border: 1px solid #2a2a3a; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        .card:hover { border-color: #15BCDF; }
        h1 { font-size: 1.8rem; margin-bottom: .5rem; }
        h2 { color: #15BCDF; margin-bottom: 1rem; }
        h3 { color: #15BCDF; margin-bottom: .75rem; }
        .subtitle { color: #888; margin-bottom: 2rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        label { font-size: .75rem; color: #888; display: block; margin-bottom: .25rem; text-transform: uppercase; }
        input, textarea { width: 100%; background: #0a0a0f; border: 1px solid #2a2a3a; color: #e0e0e0; padding: .6rem; border-radius: 8px; font-size: .9rem; font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: #15BCDF; }
        textarea { resize: vertical; min-height: 80px; }
        .row { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1rem; }
        .btn { border: 1px solid #15BCDF; color: #15BCDF; background: transparent; padding: .6rem 1.2rem; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: .85rem; font-family: inherit; }
        .btn:hover { background: #15BCDF; color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-p { background: #15BCDF; color: #fff; }
        .btn-s { border-color: #52e0a1; color: #52e0a1; }
        .btn-s:hover { background: #52e0a1; color: #000; }
        .btn-d { border-color: #ff5c7a; color: #ff5c7a; }
        .btn-d:hover { background: #ff5c7a; color: #fff; }
        .btn-w { border-color: #ffd93d; color: #ffd93d; }
        .btn-w:hover { background: #ffd93d; color: #000; }
        .note { border-radius: 8px; padding: .75rem; margin-bottom: 1rem; font-size: .85rem; display: none; }
        .note.show { display: block; }
        .note.err { background: rgba(255,92,122,.1); color: #ff5c7a; }
        .note.ok { background: rgba(82,224,161,.1); color: #52e0a1; }
        .note.warn { background: rgba(255,217,61,.1); color: #ffd93d; }
        .badge { padding: .3rem .8rem; border-radius: 20px; font-size: .75rem; font-weight: 700; }
        .grant-card { cursor: pointer; transition: border-color 0.2s; }
        .grant-card:hover { border-color: #15BCDF; }
        .grant-card h3 { color: #15BCDF; margin-bottom: .5rem; }
        .grant-card .meta { color: #888; font-size: .85rem; margin-top: .5rem; }
        .loading { display: none; text-align: center; padding: 2rem; }
        .loading.active { display: block; }
        .spinner { width: 40px; height: 40px; border: 3px solid #2a2a3a; border-top-color: #15BCDF; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-logo">GrantGuard v2</div>
    <div class="nav-links">
        <a onclick="go('grants')" id="nav-grants" class="active">Grants</a>
        <a onclick="go('create')" id="nav-create">Create Grant</a>
        <a onclick="go('status')" id="nav-status">Check Status</a>
    </div>
    <button class="wallet-btn" id="walletBtn" onclick="toggleWallet()">Connect Wallet</button>
</nav>

<div class="container">
    <div id="page-grants" class="page active">
        <h1>Available Grants</h1>
        <p class="subtitle">Click a grant to view details and apply</p>
        <div id="grants-list"><p style="color:#888">Loading grants...</p></div>
        <button class="btn btn-s" onclick="refreshGrants()" style="margin-top:1rem">Refresh Grants</button>
    </div>
    <div id="page-detail" class="page"><div id="detail-content"></div></div>
    <div id="page-create" class="page">
        <h1>Create Grant</h1>
        <p class="subtitle">Publish a new grant opportunity</p>
        <div id="create-note" class="note"></div>
        <form id="create-form">
            <div class="grid">
                <div><label>Grant ID *</label><input type="text" id="grant-id" required></div>
                <div><label>Deadline</label><input type="date" id="grant-deadline"></div>
            </div>
            <div><label>Grant Name *</label><input type="text" id="grant-name" required></div>
            <div><label>Description *</label><textarea id="grant-description" required></textarea></div>
            <div><label>Eligibility Criteria *</label><textarea id="grant-eligibility" required></textarea></div>
            <div><label>Evaluation Criteria *</label><textarea id="grant-criteria" required></textarea></div>
            <div><label>Budget Rules</label><textarea id="grant-budget"></textarea></div>
            <div><label>Required Evidence</label><textarea id="grant-evidence"></textarea></div>
            <button type="submit" class="btn btn-p">Publish Grant</button>
        </form>
        <div id="create-result" style="margin-top:1rem"></div>
    </div>
    <div id="page-status" class="page">
        <h1>Check Application Status</h1>
        <p class="subtitle">Enter Application ID (e.g., app_0)</p>
        <div class="grid"><div><label>Application ID</label><input type="text" id="check-app-id" placeholder="app_0"></div></div>
        <button class="btn btn-p" onclick="checkStatus()" style="margin-top:1rem">Check Status</button>
        <div id="status-result"></div>
    </div>
    <div id="loading" class="loading"><div class="spinner"></div><p id="loading-text">Loading...</p></div>
    <div id="note" class="note"></div>
</div>

<script>
const CONTRACT = '0x671990450Bab8f89144F50B6A619c6382E824172';
const CHAIN_ID = 61997;
const CHAIN_HEX = '0x107d';
const RPC = 'https://studio-next.genlayer.com/api';
const EXPLORER = 'https://explorer-studio-next.genlayer.com/address/' + CONTRACT;

// Pre-computed 4-byte selectors (keccak256)
var SELECTORS = {
    create_grant: '0x8d92fb02',
    fund_grant: '0x5b9d5f19',
    submit_application: '0xb2b150cc',
    evaluate_application: '0x8d5220f2',
    release_funds: '0x1dca6463',
    cancel_grant: '0x3a48f6b6',
    get_grant: '0x1214f76f',
    get_application: '0x1afc2623',
    get_stats: '0x76fee96c'
};

var acct = null;
var grants = [];

function note(msg, type) {
    var el = document.getElementById('note');
    el.textContent = msg;
    el.className = 'note show ' + (type || 'warn');
    setTimeout(function() { el.className = 'note'; }, 5000);
}

function loading(text) { document.getElementById('loading').classList.add('active'); document.getElementById('loading-text').textContent = text || 'Loading...'; }
function loaded() { document.getElementById('loading').classList.remove('active'); }

function go(page) {
    var pages = document.querySelectorAll('.page');
    for (var i = 0; i < pages.length; i++) pages[i].classList.remove('active');
    var navs = document.querySelectorAll('.nav-links a');
    for (var i = 0; i < navs.length; i++) navs[i].classList.remove('active');
    document.getElementById('page-' + page).classList.add('active');
    document.getElementById('nav-' + page).classList.add('active');
    if (page === 'grants') loadGrants();
}

async function toggleWallet() {
    if (acct) {
        acct = null;
        document.getElementById('walletBtn').textContent = 'Connect Wallet';
        document.getElementById('walletBtn').classList.remove('connected');
        note('Wallet disconnected', 'ok');
        return;
    }
    if (!window.ethereum) { note('MetaMask not detected!', 'err'); return; }
    try {
        var accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        if (!accounts || !accounts.length) throw new Error('No accounts');
        acct = accounts[0];
        var chain = await window.ethereum.request({ method: 'eth_chainId' });
        if (parseInt(chain, 16) !== CHAIN_ID) {
            try { await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{ chainId: CHAIN_HEX, chainName: 'GenLayer Studio Next', rpcUrls: [RPC], nativeCurrency: { name: 'GEN', symbol: 'GEN', decimals: 18 } }] }); } catch(e) {}
            await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CHAIN_HEX }] });
        }
        document.getElementById('walletBtn').textContent = '✓ ' + acct.slice(0,6) + '...' + acct.slice(-4);
        document.getElementById('walletBtn').classList.add('connected');
        note('Wallet connected!', 'ok');
        loadGrants();
    } catch (e) {
        note('Error: ' + e.message, 'err');
    }
}

async function ethCall(method, args) {
    var selector = SELECTORS[method] || '0x00000000';
    var data = selector + encodeArgs(args, method);
    return await window.ethereum.request({ method: 'eth_call', params: [{ to: CONTRACT, data: data }, 'latest'] });
}

async function sendTx(method, args, value) {
    if (!acct) { note('Connect wallet first!', 'err'); throw new Error('No wallet'); }
    var selector = SELECTORS[method] || '0x00000000';
    var data = selector + encodeArgs(args, method);
    return await window.ethereum.request({ method: 'eth_sendTransaction', params: [{ from: acct, to: CONTRACT, data: data, value: value ? '0x' + value.toString(16) : '0x0' }] });
}

function encodeArgs(args, method) {
    var result = '';
    var dynamicOffset = getStaticArgCount(method) * 64;
    var dynamicData = '';
    
    for (var i = 0; i < args.length; i++) {
        var arg = args[i];
        var type = getArgType(method, i);
        
        if (type === 'string') {
            var hex = stringToHex(arg);
            result += toHex(dynamicOffset, 64);
            dynamicData += toHex(hex.length / 2, 64);
            dynamicData += hex.padEnd(Math.ceil(hex.length / 64) * 64, '0');
            dynamicOffset += 64 + Math.ceil(hex.length / 64) * 64;
        } else if (type === 'uint256') {
            result += toHex(BigInt(arg || 0), 64);
        } else if (type === 'bool') {
            result += arg ? '01' : '00';
        }
    }
    return result + dynamicData;
}

function getStaticArgCount(method) {
    var counts = { create_grant: 8, fund_grant: 1, submit_application: 9, evaluate_application: 1, release_funds: 1, cancel_grant: 1, get_grant: 1, get_application: 1, get_stats: 0 };
    return counts[method] || 0;
}

function getArgType(method, index) {
    var types = {
        create_grant: ['string','string','string','string','string','string','string','string'],
        fund_grant: ['string'],
        submit_application: ['string','string','string','string','uint256','string','string','string','string'],
        evaluate_application: ['string'],
        release_funds: ['string'],
        cancel_grant: ['string'],
        get_grant: ['string'],
        get_application: ['string'],
        get_stats: []
    };
    return (types[method] || [])[index] || 'string';
}

function stringToHex(str) {
    var hex = '';
    for (var i = 0; i < str.length; i++) {
        hex += str.charCodeAt(i).toString(16).padStart(2, '0');
    }
    return hex;
}

function toHex(num, length) {
    var hex = num.toString(16);
    while (hex.length < length) hex = '0' + hex;
    return hex;
}

function decodeString(hex) {
    if (!hex || hex === '0x' || hex.length < 128) return '';
    try {
        hex = hex.startsWith('0x') ? hex.slice(2) : hex;
        var offset = parseInt(hex.slice(64, 128), 16) * 2;
        var length = parseInt(hex.slice(offset, offset + 64), 16) * 2;
        var strHex = hex.slice(offset + 64, offset + 64 + length);
        var str = '';
        for (var i = 0; i < strHex.length; i += 2) {
            str += String.fromCharCode(parseInt(strHex.slice(i, i+2), 16));
        }
        return str;
    } catch(e) { return ''; }
}

function decodeUint(hex) {
    if (!hex || hex === '0x') return 0;
    try { return parseInt(hex.startsWith('0x') ? hex.slice(2, 66) : hex.slice(0, 64), 16); } catch(e) { return 0; }
}

// Rate limit tracking
var lastCallTime = 0;
var callQueue = [];
var isProcessingQueue = false;

async function rateLimitedCall(method, args) {
    var now = Date.now();
    var timeSinceLastCall = now - lastCallTime;
    if (timeSinceLastCall < 2000) {
        await new Promise(r => setTimeout(r, 2000 - timeSinceLastCall));
    }
    lastCallTime = Date.now();
    return await ethCall(method, args);
}

async function loadGrants() {
    var listEl = document.getElementById('grants-list');
    listEl.innerHTML = '<p style="color:#888">Loading grants from chain...</p>';
    
    if (!window.ethereum) {
        listEl.innerHTML = '<p style="color:#888">Please connect wallet to view grants</p>';
        return;
    }
    
    // Check cache first
    var cached = localStorage.getItem('grantguard_grants');
    var cacheTime = localStorage.getItem('grantguard_grants_time');
    if (cached && cacheTime && (Date.now() - parseInt(cacheTime)) < 300000) {
        try {
            grants = JSON.parse(cached);
            if (grants.length > 0) {
                listEl.innerHTML = grants.map(function(g) {
                    return '<div class="card grant-card" onclick="viewGrant(\'' + g.id + '\')">' +
                        '<h3>' + g.name + '</h3>' +
                        '<div class="meta">ID: ' + g.id + ' · Click to view</div>' +
                    '</div>';
                }).join('');
                return;
            }
        } catch(e) {}
    }
    
    try {
        var statsResult = await rateLimitedCall('get_stats', []);
        var totalGrants = decodeUint(statsResult);
        
        if (totalGrants === 0) {
            listEl.innerHTML = '<p style="color:#888">No grants found. Create the first one!</p>';
            return;
        }
        
        var found = [];
        var grantIds = ['test-grant-1', 'test-grant-2', 'test-grant-3', 'grant_0', 'grant_1'];
        
        for (var i = 0; i < grantIds.length; i++) {
            try {
                var result = await rateLimitedCall('get_grant', [grantIds[i]]);
                var name = decodeString(result);
                if (name) found.push({ id: grantIds[i], name: name });
            } catch(e) {}
        }
        
        grants = found;
        
        // Cache results
        localStorage.setItem('grantguard_grants', JSON.stringify(grants));
        localStorage.setItem('grantguard_grants_time', Date.now().toString());
        
        if (grants.length === 0) {
            listEl.innerHTML = '<p style="color:#888">No grants found. Create the first one!</p>';
        } else {
            listEl.innerHTML = grants.map(function(g) {
                return '<div class="card grant-card" onclick="viewGrant(\'' + g.id + '\')">' +
                    '<h3>' + g.name + '</h3>' +
                    '<div class="meta">ID: ' + g.id + ' · Click to view details and apply</div>' +
                '</div>';
            }).join('');
        }
    } catch (e) {
        listEl.innerHTML = '<p style="color:#888">Error loading grants: ' + e.message + '</p>';
    }
}

function refreshGrants() {
    localStorage.removeItem('grantguard_grants');
    localStorage.removeItem('grantguard_grants_time');
    loadGrants();
}

function viewGrant(id) {
    var grant = grants.find(function(g) { return g.id === id; });
    go('detail');
    document.getElementById('detail-content').innerHTML = 
        '<div style="margin-bottom:1.5rem">' +
            '<h2>' + (grant ? grant.name : id) + '</h2>' +
            '<p style="color:#888">Grant ID: ' + id + '</p>' +
            '<p style="color:#888;margin-top:.5rem">View on <a href="' + EXPLORER + '" target="_blank">Explorer</a></p>' +
        '</div>' +
        '<div class="row"><button class="btn btn-w" onclick="fundGrant(\'' + id + '\')">Fund Grant</button></div>' +
        '<div id="fund-result" style="margin-top:1rem"></div>' +
        '<h3 style="margin:1.5rem 0 1rem">Apply for this Grant</h3>' +
        '<form id="apply-form">' +
            '<div class="grid">' +
                '<div><label>Project Name *</label><input type="text" id="app-name" required></div>' +
                '<div><label>Requested Amount (wei)</label><input type="text" id="app-amount" placeholder="500000000000000000"></div>' +
            '</div>' +
            '<div><label>Project Description *</label><textarea id="app-description" required></textarea></div>' +
            '<div><label>Team Information</label><textarea id="app-team"></textarea></div>' +
            '<div class="grid">' +
                '<div><label>Website</label><input type="text" id="app-website" placeholder="https://"></div>' +
                '<div><label>GitHub URL</label><input type="text" id="app-github" placeholder="https://github.com/"></div>' +
            '</div>' +
            '<div><label>Evidence URLs (comma-separated) *</label><input type="text" id="app-evidence" placeholder="https://evidence1.com, https://evidence2.com" required></div>' +
            '<div><label>Additional Info</label><textarea id="app-additional"></textarea></div>' +
            '<button type="submit" class="btn btn-p">Submit Application</button>' +
        '</form>' +
        '<div id="apply-result" style="margin-top:1rem"></div>';
    
    document.getElementById('apply-form').onsubmit = async function(e) {
        e.preventDefault();
        loading('Submitting application...');
        try {
            var txHash = await sendTx('submit_application', [
                id,
                document.getElementById('app-name').value,
                document.getElementById('app-description').value,
                document.getElementById('app-team').value,
                BigInt(document.getElementById('app-amount').value || '0'),
                document.getElementById('app-website').value,
                document.getElementById('app-github').value,
                document.getElementById('app-evidence').value,
                document.getElementById('app-additional').value
            ], 0n);
            document.getElementById('apply-result').innerHTML = '<div class="note show ok">✅ Application submitted!<br>TX: <code>' + txHash + '</code></div>';
            document.getElementById('apply-form').reset();
        } catch (e) {
            note('Error: ' + e.message, 'err');
        }
        loaded();
    };
}

async function fundGrant(grantId) {
    var amount = prompt('Enter amount to fund (in wei):', '1000000000000000000');
    if (!amount) return;
    loading('Funding grant...');
    try {
        var txHash = await sendTx('fund_grant', [grantId], BigInt(amount));
        document.getElementById('fund-result').innerHTML = '<div class="note show ok">✅ Funded!<br>TX: <code>' + txHash + '</code></div>';
    } catch (e) {
        note('Error: ' + e.message, 'err');
    }
    loaded();
}

document.getElementById('create-form').onsubmit = async function(e) {
    e.preventDefault();
    loading('Publishing grant...');
    try {
        var txHash = await sendTx('create_grant', [
            document.getElementById('grant-id').value,
            document.getElementById('grant-name').value,
            document.getElementById('grant-description').value,
            document.getElementById('grant-eligibility').value,
            document.getElementById('grant-criteria').value,
            document.getElementById('grant-budget').value,
            document.getElementById('grant-evidence').value,
            document.getElementById('grant-deadline').value
        ], 0n);
        document.getElementById('create-result').innerHTML = '<div class="note show ok">✅ Grant published!<br>ID: <code>' + document.getElementById('grant-id').value + '</code><br>TX: <code>' + txHash + '</code></div>';
        document.getElementById('create-form').reset();
        note('Grant created! Go to Grants tab to see it.', 'ok');
    } catch (e) {
        note('Error: ' + e.message, 'err');
    }
    loaded();
};

async function checkStatus() {
    var appId = document.getElementById('check-app-id').value.trim();
    if (!appId) { note('Enter application ID', 'warn'); return; }
    loading('Checking status...');
    try {
        var result = await ethCall('get_application', [appId]);
        var resultEl = document.getElementById('status-result');
        resultEl.innerHTML = '<div class="card" style="margin-top:1rem">' +
            '<h2>Application: ' + appId + '</h2>' +
            '<div style="font-family:monospace;font-size:.8rem;word-break:break-all;background:#0a0a0f;padding:.5rem;border-radius:4px;margin-top:.5rem">' + result + '</div>' +
            '<p style="margin-top:1rem"><a href="' + EXPLORER + '" target="_blank">View on Explorer</a></p>' +
        '</div>' +
        '<button class="btn btn-p" onclick="evaluateApp(\'' + appId + '\')" style="margin-top:1rem">Evaluate</button>' +
        '<button class="btn btn-s" onclick="releaseFunds(\'' + appId + '\')" style="margin-top:1rem;margin-left:.5rem">Release Funds</button>';
    } catch (e) {
        note('Error: ' + e.message, 'err');
    }
    loaded();
}

async function evaluateApp(appId) {
    loading('Evaluating application... (1-3 min)');
    try {
        var txHash = await sendTx('evaluate_application', [appId], 0n);
        note('Evaluation started! TX: ' + txHash, 'ok');
    } catch (e) {
        note('Error: ' + e.message, 'err');
    }
    loaded();
}

async function releaseFunds(appId) {
    loading('Releasing funds...');
    try {
        var txHash = await sendTx('release_funds', [appId], 0n);
        note('Funds released! TX: ' + txHash, 'ok');
    } catch (e) {
        note('Error: ' + e.message, 'err');
    }
    loaded();
}

if (window.ethereum) {
    window.ethereum.on('accountsChanged', function(a) {
        if (!a.length) {
            acct = null;
            document.getElementById('walletBtn').textContent = 'Connect Wallet';
            document.getElementById('walletBtn').classList.remove('connected');
        }
    });
    window.ethereum.on('chainChanged', function() { loadGrants(); });
}

(async function() {
    if (window.ethereum) {
        try {
            var a = await window.ethereum.request({ method: 'eth_accounts' });
            if (a && a.length) {
                acct = a[0];
                var c = await window.ethereum.request({ method: 'eth_chainId' });
                if (parseInt(c, 16) === CHAIN_ID) {
                    document.getElementById('walletBtn').textContent = '✓ ' + acct.slice(0,6) + '...' + acct.slice(-4);
                    document.getElementById('walletBtn').classList.add('connected');
                    loadGrants();
                }
            }
        } catch(e) {}
    }
})();
</script>
</body>
</html>
