<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrantGuard v2</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; }
        .navbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 1rem; padding: 1rem 2rem; background: #0a0a0f; border-bottom: 1px solid #2a2a3a; }
        .nav-logo { font-size: 1.4rem; font-weight: 700; }
        .nav-links { display: flex; gap: 2rem; align-items: center; margin-left: auto; }
        .nav-links a { font-weight: 700; font-size: .9rem; color: #888; cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { color: #15BCDF; }
        .wallet-btn { border: 1px solid #15BCDF; color: #15BCDF; background: transparent; padding: .5rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 700; }
        .wallet-btn.connected { background: #52e0a1; border-color: #52e0a1; color: #000; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        .page { display: none; }
        .page.active { display: block; }
        .card { background: #161620; border: 1px solid #2a2a3a; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
        h1 { font-size: 1.8rem; margin-bottom: .5rem; }
        h2, h3 { color: #15BCDF; margin-bottom: 1rem; }
        .subtitle { color: #888; margin-bottom: 2rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        label { font-size: .75rem; color: #888; display: block; margin-bottom: .25rem; text-transform: uppercase; }
        input, textarea { width: 100%; background: #0a0a0f; border: 1px solid #2a2a3a; color: #e0e0e0; padding: .6rem; border-radius: 8px; font-size: .9rem; font-family: inherit; }
        textarea { resize: vertical; min-height: 80px; }
        .row { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1rem; }
        .btn { border: 1px solid #15BCDF; color: #15BCDF; background: transparent; padding: .6rem 1.2rem; border-radius: 8px; cursor: pointer; font-weight: 700; font-size: .85rem; }
        .btn:hover { background: #15BCDF; color: #fff; }
        .btn-p { background: #15BCDF; color: #fff; }
        .btn-s { border-color: #52e0a1; color: #52e0a1; }
        .btn-d { border-color: #ff5c7a; color: #ff5c7a; }
        .btn-w { border-color: #ffd93d; color: #ffd93d; }
        .note { border-radius: 8px; padding: .75rem; margin-bottom: 1rem; font-size: .85rem; display: none; }
        .note.show { display: block; }
        .note.err { background: rgba(255,92,122,.1); color: #ff5c7a; }
        .note.ok { background: rgba(82,224,161,.1); color: #52e0a1; }
        .grant-card { cursor: pointer; }
        .grant-card:hover { border-color: #15BCDF; }
        .grant-card h3 { color: #15BCDF; margin-bottom: .5rem; }
        .grant-card .meta { color: #888; font-size: .85rem; margin-top: .5rem; }
        .loading { display: none; text-align: center; padding: 2rem; }
        .loading.active { display: block; }
        .spinner { width: 40px; height: 40px; border: 3px solid #2a2a3a; border-top-color: #15BCDF; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="nav-logo">GrantGuard v2</div>
    <div class="nav-links">
        <a onclick="go('grants')" id="nav-grants" class="active">Grants</a>
        <a onclick="go('create')" id="nav-create">Create Grant</a>
        <a onclick="go('status')" id="nav-status">Check Status</a>
    </div>
    <button class="wallet-btn" id="walletBtn" onclick="toggleWallet()">Connect Wallet</button>
</nav>

<div class="container">
    <div id="page-grants" class="page active">
        <h1>Available Grants</h1>
        <p class="subtitle">Click a grant to view details and apply</p>
        <div id="grants-list"><p style="color:#888">Loading grants...</p></div>
    </div>
    <div id="page-detail" class="page"><div id="detail-content"></div></div>
    <div id="page-create" class="page">
        <h1>Create Grant</h1>
        <p class="subtitle">Publish a new grant opportunity</p>
        <form id="create-form">
            <div class="grid">
                <div><label>Grant ID *</label><input type="text" id="grant-id" required></div>
                <div><label>Deadline</label><input type="date" id="grant-deadline"></div>
            </div>
            <div><label>Grant Name *</label><input type="text" id="grant-name" required></div>
            <div><label>Description *</label><textarea id="grant-description" required></textarea></div>
            <div><label>Eligibility Criteria *</label><textarea id="grant-eligibility" required></textarea></div>
            <div><label>Evaluation Criteria *</label><textarea id="grant-criteria" required></textarea></div>
            <div><label>Budget Rules</label><textarea id="grant-budget"></textarea></div>
            <div><label>Required Evidence</label><textarea id="grant-evidence"></textarea></div>
            <button type="submit" class="btn btn-p">Publish Grant</button>
        </form>
        <div id="create-result" style="margin-top:1rem"></div>
    </div>
    <div id="page-status" class="page">
        <h1>Check Application Status</h1>
        <p class="subtitle">Enter Application ID (e.g., app_0)</p>
        <div class="grid"><div><label>Application ID</label><input type="text" id="check-app-id" placeholder="app_0"></div></div>
        <button class="btn btn-p" onclick="checkStatus()" style="margin-top:1rem">Check Status</button>
        <div id="status-result"></div>
    </div>
    <div id="loading" class="loading"><div class="spinner"></div><p id="loading-text">Loading...</p></div>
    <div id="note" class="note"></div>
</div>

<script src="https://unpkg.com/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script>
const CONTRACT = '0x671990450Bab8f89144F50B6A619c6382E824172';
const CHAIN_ID = 61997;
const CHAIN_HEX = '0x107d';
const RPC = 'https://studio-next.genlayer.com/api';
const EXPLORER = 'https://explorer-studio-next.genlayer.com/address/' + CONTRACT;

const ABI = [
    "function create_grant(string grant_id, string name, string description, string eligibility, string criteria, string budget_rules, string required_evidence, string deadline) returns (string)",
    "function fund_grant(string grant_id) payable returns (string)",
    "function submit_application(string grant_id, string project_name, string project_description, string team_info, uint256 requested_amount, string website, string github_url, string evidence_urls, string additional_info) returns (string)",
    "function evaluate_application(string app_id) returns (string)",
    "function release_funds(string app_id) returns (string)",
    "function cancel_grant(string grant_id) returns (bool)",
    "function get_grant(string grant_id) returns (tuple(string id, string name, string description, string eligibility, string criteria, string budget_rules, string required_evidence, string deadline, address creator, bool active, uint256 funded_amount, uint256 paid_out))",
    "function get_application(string app_id) returns (tuple(string id, string grant_id, string project_name, string project_description, string team_info, uint256 requested_amount, string website, string github_url, string evidence_urls, string additional_info, string status, string evaluation))",
    "function get_stats() returns (tuple(uint256 total_grants, uint256 total_applications))"
];

var provider = null;
var signer = null;
var contract = null;
var acct = null;
var grants = [];

function note(msg, type) {
    var el = document.getElementById('note');
    el.textContent = msg;
    el.className = 'note show ' + (type || 'warn');
    setTimeout(function() { el.className = 'note'; }, 5000);
}

function loading(text) { document.getElementById('loading').classList.add('active'); document.getElementById('loading-text').textContent = text || 'Loading...'; }
function loaded() { document.getElementById('loading').classList.remove('active'); }

function go(page) {
    var pages = document.querySelectorAll('.page');
    for (var i = 0; i < pages.length; i++) pages[i].classList.remove('active');
    var navs = document.querySelectorAll('.nav-links a');
    for (var i = 0; i < navs.length; i++) navs[i].classList.remove('active');
    document.getElementById('page-' + page).classList.add('active');
    document.getElementById('nav-' + page).classList.add('active');
    if (page === 'grants') loadGrants();
}

async function toggleWallet() {
    if (acct) {
        acct = null; provider = null; signer = null; contract = null;
        document.getElementById('walletBtn').textContent = 'Connect Wallet';
        document.getElementById('walletBtn').classList.remove('connected');
        note('Wallet disconnected', 'ok');
        return;
    }
    if (!window.ethereum) { note('MetaMask not detected!', 'err'); return; }
    try {
        // Wait for ethers to load
        await waitForEthers();
        provider = new window.ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        acct = await signer.getAddress();
        var network = await provider.getNetwork();
        if (network.chainId !== CHAIN_ID) {
            try { await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{ chainId: CHAIN_HEX, chainName: 'GenLayer Studio Next', rpcUrls: [RPC], nativeCurrency: { name: 'GEN', symbol: 'GEN', decimals: 18 } }] }); } catch(e) {}
            await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CHAIN_HEX }] });
            provider = new window.ethers.providers.Web3Provider(window.ethereum);
            signer = provider.getSigner();
        }
        contract = new window.ethers.Contract(CONTRACT, ABI, signer);
        document.getElementById('walletBtn').textContent = '✓ ' + acct.slice(0,6) + '...' + acct.slice(-4);
        document.getElementById('walletBtn').classList.add('connected');
        note('Wallet connected!', 'ok');
        loadGrants();
    } catch (e) { note('Error: ' + e.message, 'err'); }
}

function waitForEthers() {
    return new Promise(function(resolve, reject) {
        var attempts = 0;
        var interval = setInterval(function() {
            attempts++;
            if (window.ethers && window.ethers.providers) {
                clearInterval(interval);
                resolve();
            } else if (attempts > 50) {
                clearInterval(interval);
                reject(new Error('ethers.js failed to load'));
            }
        }, 100);
    });
}

async function loadGrants() {
    var listEl = document.getElementById('grants-list');
    listEl.innerHTML = '<p style="color:#888">Loading grants...</p>';
    if (!contract) { listEl.innerHTML = '<p style="color:#888">Connect wallet first</p>'; return; }
    try {
        var stats = await contract.get_stats();
        var totalGrants = Number(stats.total_grants);
        if (totalGrants === 0) { listEl.innerHTML = '<p style="color:#888">No grants found. Create the first one!</p>'; return; }
        var found = [];
        var idsToTry = ['test-grant-1', 'test-grant-2', 'test-grant-3', 'grant_0', 'grant_1', 'grant_2'];
        for (var i = 0; i < idsToTry.length; i++) {
            try {
                var grant = await contract.get_grant(idsToTry[i]);
                if (grant && grant.id) found.push({ id: grant.id, name: grant.name });
            } catch(e) {}
        }
        grants = found;
        if (grants.length === 0) {
            listEl.innerHTML = '<p style="color:#888">No grants found. Create the first one!</p>';
        } else {
            listEl.innerHTML = grants.map(function(g) {
                return '<div class="card grant-card" onclick="viewGrant(\'' + g.id + '\')"><h3>' + g.name + '</h3><div class="meta">ID: ' + g.id + ' · Click to view</div></div>';
            }).join('');
        }
    } catch (e) { listEl.innerHTML = '<p style="color:#888">Error: ' + e.message + '</p>'; }
}

function viewGrant(id) {
    var grant = grants.find(function(g) { return g.id === id; });
    go('detail');
    document.getElementById('detail-content').innerHTML = 
        '<h2>' + (grant ? grant.name : id) + '</h2>' +
        '<p style="color:#888">ID: ' + id + '</p>' +
        '<p><a href="' + EXPLORER + '" target="_blank">View on Explorer</a></p>' +
        '<div class="row"><button class="btn btn-w" onclick="fundGrant(\'' + id + '\')">Fund Grant</button></div>' +
        '<div id="fund-result"></div>' +
        '<h3 style="margin-top:1.5rem">Apply for this Grant</h3>' +
        '<form id="apply-form">' +
            '<div class="grid"><div><label>Project Name *</label><input type="text" id="app-name" required></div><div><label>Amount (wei)</label><input type="text" id="app-amount" placeholder="500000000000000000"></div></div>' +
            '<div><label>Description *</label><textarea id="app-description" required></textarea></div>' +
            '<div><label>Team Info</label><textarea id="app-team"></textarea></div>' +
            '<div class="grid"><div><label>Website</label><input type="text" id="app-website"></div><div><label>GitHub URL</label><input type="text" id="app-github"></div></div>' +
            '<div><label>Evidence URLs *</label><input type="text" id="app-evidence" required></div>' +
            '<div><label>Additional Info</label><textarea id="app-additional"></textarea></div>' +
            '<button type="submit" class="btn btn-p">Submit Application</button>' +
        '</form>' +
        '<div id="apply-result"></div>';
    document.getElementById('apply-form').onsubmit = async function(e) {
        e.preventDefault();
        loading('Submitting...');
        try {
            var tx = await contract.submit_application(id, document.getElementById('app-name').value, document.getElementById('app-description').value, document.getElementById('app-team').value, document.getElementById('app-amount').value || '0', document.getElementById('app-website').value, document.getElementById('app-github').value, document.getElementById('app-evidence').value, document.getElementById('app-additional').value);
            document.getElementById('apply-result').innerHTML = '<div class="note show ok">✅ Submitted!<br>TX: ' + tx.hash + '</div>';
        } catch (e) { note('Error: ' + e.message, 'err'); }
        loaded();
    };
}

async function fundGrant(grantId) {
    var amount = prompt('Amount in wei:', '1000000000000000000');
    if (!amount) return;
    loading('Funding...');
    try {
        var tx = await contract.fund_grant(grantId, { value: amount });
        document.getElementById('fund-result').innerHTML = '<div class="note show ok">✅ Funded!<br>TX: ' + tx.hash + '</div>';
    } catch (e) { note('Error: ' + e.message, 'err'); }
    loaded();
}

document.getElementById('create-form').onsubmit = async function(e) {
    e.preventDefault();
    loading('Publishing grant...');
    try {
        var tx = await contract.create_grant(document.getElementById('grant-id').value, document.getElementById('grant-name').value, document.getElementById('grant-description').value, document.getElementById('grant-eligibility').value, document.getElementById('grant-criteria').value, document.getElementById('grant-budget').value, document.getElementById('grant-evidence').value, document.getElementById('grant-deadline').value);
        document.getElementById('create-result').innerHTML = '<div class="note show ok">✅ Published!<br>TX: ' + tx.hash + '</div>';
        document.getElementById('create-form').reset();
    } catch (e) { note('Error: ' + e.message, 'err'); }
    loaded();
};

async function checkStatus() {
    var appId = document.getElementById('check-app-id').value.trim();
    if (!appId) { note('Enter App ID', 'warn'); return; }
    loading('Checking...');
    try {
        var result = await contract.get_application(appId);
        var html = '<div class="card"><h2>App: ' + appId + '</h2><p>Project: ' + result.project_name + '</p><p>Status: ' + result.status + '</p>';
        if (result.evaluation) {
            html += '<div style="margin-top:1rem;padding:1rem;background:#0a0a0f;border-radius:8px"><pre>' + result.evaluation + '</pre></div>';
        }
        html += '</div>';
        html += '<button class="btn btn-p" onclick="evaluateApp(\'' + appId + '\')" style="margin-top:1rem">Evaluate</button>';
        html += '<button class="btn btn-s" onclick="releaseFunds(\'' + appId + '\')" style="margin-top:1rem;margin-left:.5rem">Release Funds</button>';
        document.getElementById('status-result').innerHTML = html;
    } catch (e) { note('Error: ' + e.message, 'err'); }
    loaded();
}

async function evaluateApp(appId) {
    loading('Evaluating... (1-3 min)');
    try {
        var tx = await contract.evaluate_application(appId);
        note('Evaluation started! TX: ' + tx.hash, 'ok');
    } catch (e) { note('Error: ' + e.message, 'err'); }
    loaded();
}

async function releaseFunds(appId) {
    loading('Releasing funds...');
    try {
        var tx = await contract.release_funds(appId);
        note('Funds released! TX: ' + tx.hash, 'ok');
    } catch (e) { note('Error: ' + e.message, 'err'); }
    loaded();
}

if (window.ethereum) {
    window.ethereum.on('accountsChanged', function(a) {
        if (!a.length) { acct = null; provider = null; signer = null; contract = null; document.getElementById('walletBtn').textContent = 'Connect Wallet'; document.getElementById('walletBtn').classList.remove('connected'); }
    });
}

(async function() {
    if (window.ethereum) {
        try {
            await waitForEthers();
            provider = new window.ethers.providers.Web3Provider(window.ethereum);
            var accounts = await provider.listAccounts();
            if (accounts && accounts.length) {
                signer = provider.getSigner();
                acct = await signer.getAddress();
                var network = await provider.getNetwork();
                if (network.chainId === CHAIN_ID) {
                    contract = new window.ethers.Contract(CONTRACT, ABI, signer);
                    document.getElementById('walletBtn').textContent = '✓ ' + acct.slice(0,6) + '...' + acct.slice(-4);
                    document.getElementById('walletBtn').classList.add('connected');
                    loadGrants();
                }
            }
        } catch(e) {}
    }
})();
</script>
</body>
</html>
