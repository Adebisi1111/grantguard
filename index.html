<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrantGuard | Grant Application Evaluator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
        h1 { font-size: 2.2rem; color: #00d4aa; margin-bottom: 0.5rem; }
        .subtitle { color: #7c3aed; font-size: 1rem; margin-bottom: 2rem; }
        
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid #2a2a3a; }
        .tab { padding: 0.75rem 1.5rem; cursor: pointer; color: #888; border-bottom: 2px solid transparent; }
        .tab.active { color: #00d4aa; border-bottom-color: #00d4aa; }
        
        .page { display: none; }
        .page.active { display: block; }
        
        .grant-card { background: #0f1520; border: 1px solid #2a2a3a; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; cursor: pointer; transition: border-color 0.2s; }
        .grant-card:hover { border-color: #00d4aa; }
        .grant-card h3 { color: #00d4aa; margin-bottom: 0.5rem; }
        .grant-card .deadline { color: #ffd93d; font-size: 0.85rem; margin-top: 0.5rem; }
        
        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.85rem; color: #888; margin-bottom: 0.3rem; }
        input, textarea, select { width: 100%; padding: 0.75rem; background: #0a0a0f; border: 1px solid #2a2a3a; border-radius: 6px; color: #e0e0e0; font-size: 0.9rem; }
        input:focus, textarea:focus { outline: none; border-color: #00d4aa; }
        textarea { resize: vertical; min-height: 100px; }
        
        .btn { background: linear-gradient(135deg, #00d4aa, #7c3aed); color: white; border: none; padding: 0.75rem 2rem; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { background: #333; color: #666; cursor: not-allowed; }
        .btn-sm { padding: 0.5rem 1rem; font-size: 0.85rem; }
        
        .result-box { background: #0f1520; border: 1px solid #2a2a3a; border-radius: 8px; padding: 1.5rem; margin-top: 1rem; }
        .result-box h2 { color: #00d4aa; margin-bottom: 1rem; }
        
        .criteria-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem; }
        .criteria-item { background: #0a0a0f; padding: 0.75rem; border-radius: 6px; }
        .criteria-item .label { color: #888; font-size: 0.75rem; }
        .criteria-item .value { font-weight: 600; margin-top: 0.25rem; }
        
        .PASS { color: #00d4aa; }
        .REVIEW { color: #ffd93d; }
        .FAIL { color: #ff6b6b; }
        .INSUFFICIENT_EVIDENCE { color: #ff9f43; }
        
        .final-assessment { background: #0a0a0f; padding: 1rem; border-radius: 6px; margin-bottom: 1rem; }
        .final-assessment .label { color: #888; font-size: 0.85rem; }
        .final-assessment .value { font-size: 1.5rem; font-weight: 700; margin-top: 0.25rem; }
        
        .reasons { margin-bottom: 1rem; }
        .reasons h4 { color: #888; margin-bottom: 0.5rem; }
        .reasons ul { list-style: none; padding-left: 0; }
        .reasons li { padding: 0.25rem 0; padding-left: 1rem; position: relative; }
        .reasons li::before { content: "•"; position: absolute; left: 0; color: #7c3aed; }
        
        .status-badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .status-SUBMITTED { background: #7c3aed33; color: #7c3aed; }
        .status-EVALUATING { background: #ffd93d33; color: #ffd93d; }
        .status-EVALUATED { background: #00d4aa33; color: #00d4aa; }
        .status-FAILED_TO_EVALUATE { background: #ff6b6b33; color: #ff6b6b; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .full-width { grid-column: 1 / -1; }
        
        .loading { display: none; text-align: center; padding: 2rem; }
        .loading.active { display: block; }
        .spinner { width: 40px; height: 40px; border: 3px solid #2a2a3a; border-top-color: #00d4aa; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .error { background: #ff6b6b33; border: 1px solid #ff6b6b; padding: 1rem; border-radius: 6px; color: #ff6b6b; margin-bottom: 1rem; display: none; }
        .error.active { display: block; }
        
        .success { background: #00d4aa33; border: 1px solid #00d4aa; padding: 1rem; border-radius: 6px; color: #00d4aa; margin-bottom: 1rem; display: none; }
        .success.active { display: block; }
        
        .grant-detail { margin-bottom: 2rem; }
        .grant-detail h2 { color: #00d4aa; margin-bottom: 0.5rem; }
        .grant-detail .field { margin-bottom: 0.5rem; }
        .grant-detail .field-label { color: #888; font-size: 0.8rem; }
        .grant-detail .field-value { font-size: 0.95rem; }
        
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid #2a2a3a; }
        .nav-links { display: flex; gap: 1rem; }
        .nav-links a { color: #888; text-decoration: none; font-size: 0.9rem; }
        .nav-links a:hover, .nav-links a.active { color: #00d4aa; }
        .logo { font-size: 1.2rem; font-weight: 700; color: #00d4aa; }
        
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="nav">
            <div class="logo">GrantGuard</div>
            <div class="nav-links">
                <a href="#" onclick="showPage('grants')" class="active" id="nav-grants">Grants</a>
                <a href="#" onclick="showPage('create-grant')" id="nav-create">Create Grant</a>
                <a href="#" onclick="showPage('check-status')" id="nav-status">Check Status</a>
            </div>
        </nav>
        
        <div id="grants-page" class="page active">
            <h1>Available Grants</h1>
            <p class="subtitle">Browse active grant opportunities</p>
            <div id="grants-list"></div>
        </div>
        
        <div id="grant-detail-page" class="page">
            <div id="grant-detail"></div>
            <div id="application-form"></div>
        </div>
        
        <div id="create-grant-page" class="page">
            <h1>Create Grant</h1>
            <p class="subtitle">Publish a new grant opportunity</p>
            <div id="create-grant-success" class="success"></div>
            <form id="create-grant-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Grant Name *</label>
                        <input type="text" id="grant-name" required>
                    </div>
                    <div class="form-group">
                        <label>Deadline</label>
                        <input type="date" id="grant-deadline">
                    </div>
                </div>
                <div class="form-group">
                    <label>Description *</label>
                    <textarea id="grant-description" required></textarea>
                </div>
                <div class="form-group">
                    <label>Eligibility Criteria *</label>
                    <textarea id="grant-eligibility" required></textarea>
                </div>
                <div class="form-group">
                    <label>Evaluation Criteria *</label>
                    <textarea id="grant-criteria" required></textarea>
                </div>
                <div class="form-group">
                    <label>Budget Rules</label>
                    <textarea id="grant-budget"></textarea>
                </div>
                <div class="form-group">
                    <label>Required Evidence</label>
                    <textarea id="grant-evidence"></textarea>
                </div>
                <button type="submit" class="btn">Publish Grant</button>
            </form>
        </div>
        
        <div id="check-status-page" class="page">
            <h1>Check Application Status</h1>
            <p class="subtitle">Enter your unique Application ID</p>
            <div class="form-group">
                <label>Application ID (UUID)</label>
                <input type="text" id="check-app-id" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
            </div>
            <button class="btn btn-sm" onclick="checkStatus()">Check</button>
            <div id="status-result"></div>
        </div>
        
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p id="loading-text">Loading...</p>
        </div>
        
        <div id="error" class="error"></div>
    </div>

    <script>
    const API = 'https://grantguard-56ax.onrender.com';
    
    let grants = [];
    let currentGrantId = null;
    
    loadGrants();
    
    function showPage(page) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        
        const pageEl = document.getElementById(page + '-page');
        if (pageEl) pageEl.classList.add('active');
        
        const navEl = document.getElementById('nav-' + page);
        if (navEl) navEl.classList.add('active');
        
        currentGrantId = null;
    }
    
    function showError(msg) {
        const el = document.getElementById('error');
        el.textContent = msg;
        el.classList.add('active');
        setTimeout(() => el.classList.remove('active'), 5000);
    }
    
    function showLoading(text) {
        document.getElementById('loading').classList.add('active');
        document.getElementById('loading-text').textContent = text || 'Loading...';
    }
    
    function hideLoading() {
        document.getElementById('loading').classList.remove('active');
    }
    
    async function loadGrants() {
        showLoading('Loading grants... (waking up server if needed)');
        
        for (let i = 0; i < 15; i++) {
            try {
                const res = await fetch(API + '/api/grants');
                if (!res.ok) throw new Error('Server error: ' + res.status);
                grants = await res.json();
                
                const listEl = document.getElementById('grants-list');
                if (grants.length === 0) {
                    listEl.innerHTML = '<p style="color:#666;">No grants available yet. Create the first one!</p>';
                } else {
                    let html = '';
                    grants.forEach(g => {
                        html += `<div class="grant-card" onclick="viewGrant(${g.id})">
                            <h3>${g.name}</h3>
                            <p>${g.description ? g.description.slice(0, 100) + '...' : ''}</p>
                            <div class="deadline">Deadline: ${g.deadline || 'No deadline'}</div>
                        </div>`;
                    });
                    listEl.innerHTML = html;
                }
                hideLoading();
                return;
            } catch(e) {
                await new Promise(r => setTimeout(r, 2000));
            }
        }
        showError('Failed to load grants. Please refresh.');
        hideLoading();
    }
    
    function viewGrant(id) {
        currentGrantId = id;
        const grant = grants.find(g => g.id === id);
        if (!grant) return;
        
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById('grant-detail-page').classList.add('active');
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        
        const detailEl = document.getElementById('grant-detail');
        detailEl.innerHTML = `
            <div class="grant-detail">
                <h2>${grant.name}</h2>
                <div class="field"><div class="field-label">Description</div><div class="field-value">${grant.description || '-'}</div></div>
                <div class="field"><div class="field-label">Eligibility</div><div class="field-value">${grant.eligibility || '-'}</div></div>
                <div class="field"><div class="field-label">Evaluation Criteria</div><div class="field-value">${grant.criteria || '-'}</div></div>
                <div class="field"><div class="field-label">Budget Rules</div><div class="field-value">${grant.budget_rules || '-'}</div></div>
                <div class="field"><div class="field-label">Required Evidence</div><div class="field-value">${grant.required_evidence || '-'}</div></div>
                <div class="field"><div class="field-label">Deadline</div><div class="field-value">${grant.deadline || 'No deadline'}</div></div>
            </div>
        `;
        
        const formEl = document.getElementById('application-form');
        formEl.innerHTML = `
            <h3 style="color:#7c3aed;margin:1.5rem 0 1rem;">Apply for this Grant</h3>
            <div id="apply-success" class="success"></div>
            <div id="apply-error" class="error"></div>
            <form id="apply-form">
                <div class="form-row">
                    <div class="form-group"><label>Project Name *</label><input type="text" id="app-project-name" required></div>
                    <div class="form-group"><label>Requested Amount (GEN)</label><input type="text" id="app-amount" placeholder="5000"></div>
                </div>
                <div class="form-group"><label>Project Description *</label><textarea id="app-description" required></textarea></div>
                <div class="form-group"><label>Team Information</label><textarea id="app-team" placeholder="Team size, relevant experience"></textarea></div>
                <div class="form-row">
                    <div class="form-group"><label>Website</label><input type="url" id="app-website" placeholder="https://"></div>
                    <div class="form-group"><label>GitHub URL</label><input type="url" id="app-github" placeholder="https://github.com/"></div>
                </div>
                <div class="form-group"><label>Evidence URLs (comma-separated)</label><input type="text" id="app-evidence" placeholder="https://evidence1.com, https://evidence2.com"></div>
                <div class="form-group"><label>Additional Information</label><textarea id="app-additional" placeholder="Anything else you want to share"></textarea></div>
                <button type="submit" class="btn">Submit Application</button>
            </form>
        `;
        
        document.getElementById('apply-form').onsubmit = submitApplication;
    }
    
    async function submitApplication(e) {
        e.preventDefault();
        
        const data = {
            grant_id: currentGrantId,
            project_name: document.getElementById('app-project-name').value,
            project_description: document.getElementById('app-description').value,
            team_info: document.getElementById('app-team').value,
            requested_amount: document.getElementById('app-amount').value,
            website: document.getElementById('app-website').value,
            github_url: document.getElementById('app-github').value,
            evidence_urls: document.getElementById('app-evidence').value,
            additional_info: document.getElementById('app-additional').value
        };
        
        showLoading('Submitting application...');
        document.getElementById('apply-success').classList.remove('active');
        document.getElementById('apply-error').classList.remove('active');
        
        try {
            const res = await fetch(API + '/api/applications', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            
            if (result.status === 'success') {
                const successEl = document.getElementById('apply-success');
                successEl.innerHTML = `<div style="font-size:1.3rem;font-weight:700;margin-bottom:0.75rem;">✅ Application submitted successfully.</div><div style="margin-bottom:0.5rem;">Your Application ID:</div><div style="font-size:1.5rem;font-weight:700;color:#00d4aa;margin-bottom:0.5rem;font-family:monospace;word-break:break-all;">${result.app_id}</div><div style="color:#ffd93d;margin-bottom:1rem;">⚠️ Save this ID. You will use it to check your application status and evaluation.</div><button class="btn btn-sm" onclick="document.getElementById('check-app-id').value='${result.app_id}';showPage('check-status');">Check Status Now</button>`;
                successEl.classList.add('active');
                document.getElementById('apply-form').reset();
            } else {
                throw new Error(result.detail || 'Unknown error');
            }
        } catch(e) {
            const errorEl = document.getElementById('apply-error');
            errorEl.textContent = 'Error: ' + e.message;
            errorEl.classList.add('active');
        }
        hideLoading();
    }
    
    document.getElementById('create-grant-form').onsubmit = async function(e) {
        e.preventDefault();
        
        const data = {
            name: document.getElementById('grant-name').value,
            description: document.getElementById('grant-description').value,
            eligibility: document.getElementById('grant-eligibility').value,
            criteria: document.getElementById('grant-criteria').value,
            budget_rules: document.getElementById('grant-budget').value,
            required_evidence: document.getElementById('grant-evidence').value,
            deadline: document.getElementById('grant-deadline').value
        };
        
        showLoading('Publishing grant...');
        
        try {
            const res = await fetch(API + '/api/grants', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            
            if (result.status === 'success') {
                const successEl = document.getElementById('create-grant-success');
                successEl.textContent = 'Grant published! ID: ' + result.grant_id + ', TX: ' + result.tx_hash;
                successEl.classList.add('active');
                document.getElementById('create-grant-form').reset();
                setTimeout(() => {
                    showPage('grants');
                    loadGrants();
                }, 2000);
            } else {
                throw new Error(result.detail || 'Unknown error');
            }
        } catch(e) {
            showError('Error: ' + e.message);
        }
        hideLoading();
    };
    
    async function checkStatus() {
        const appId = document.getElementById('check-app-id').value.trim();
        if (!appId) {
            showError('Enter application ID');
            return;
        }
        
        showLoading('Checking status...');
        
        for (let i = 0; i < 5; i++) {
            try {
                const res = await fetch(API + '/api/applications/' + encodeURIComponent(appId));
                if (!res.ok) throw new Error('Not found');
                const app = await res.json();
                
                const resultEl = document.getElementById('status-result');
                let html = `<div class="result-box"><h2>Application #${app.id}</h2><p><strong>UUID:</strong> <span style="font-family:monospace;color:#00d4aa;">${appId}</span></p><p><strong>Project:</strong> ${app.project_name}</p><p><strong>Status:</strong> <span class="status-badge status-${app.status}">${app.status}</span></p>`;
                
                if (app.status === 'EVALUATED' && app.evaluation) {
                    const ev = typeof app.evaluation === 'string' ? JSON.parse(app.evaluation) : app.evaluation;
                    html += `<div class="final-assessment"><div class="label">Final Assessment</div><div class="value ${ev.final}">${ev.final}</div></div><div class="criteria-grid"><div class="criteria-item"><div class="label">Eligibility</div><div class="value ${ev.eligibility}">${ev.eligibility}</div></div><div class="criteria-item"><div class="label">Completeness</div><div class="value ${ev.completeness}">${ev.completeness}</div></div><div class="criteria-item"><div class="label">Feasibility</div><div class="value ${ev.feasibility}">${ev.feasibility}</div></div><div class="criteria-item"><div class="label">Budget</div><div class="value ${ev.budget}">${ev.budget}</div></div><div class="criteria-item"><div class="label">Evidence</div><div class="value ${ev.evidence}">${ev.evidence}</div></div></div><div class="reasons"><h4>Reasons</h4><ul>${ev.reasons.map(r => `<li>${r}</li>`).join('')}</ul></div>`;
                } else if (app.status === 'SUBMITTED') {
                    html += `<button class="btn btn-sm" onclick="evaluateApp('${appId}')" style="margin-top:1rem;">Evaluate Application</button>`;
                }
                
                html += '</div>';
                resultEl.innerHTML = html;
                hideLoading();
                return;
            } catch(e) {
                await new Promise(r => setTimeout(r, 2000));
            }
        }
        showError('Failed to load application. Please refresh.');
        hideLoading();
    }
    
    async function evaluateApp(appId) {
        showLoading('Evaluating application...');
        
        for (let i = 0; i < 5; i++) {
            try {
                const res = await fetch(API + '/api/applications/' + encodeURIComponent(appId) + '/evaluate', {
                    method: 'POST'
                });
                const data = await res.json();
                if (data.status === 'success') {
                    checkStatus();
                    hideLoading();
                    return;
                } else {
                    throw new Error(data.detail || 'Evaluation failed');
                }
            } catch(e) {
                if (i < 4) {
                    await new Promise(r => setTimeout(r, 2000));
                }
            }
        }
        showError('Failed to evaluate. Please try again.');
        hideLoading();
    }
    </script>
</body>
</html>
