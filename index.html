<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrantGuard v2</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #0a0a0f; color: #e0e0e0; padding: 1rem; }
        .wrap { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 1.5rem; margin-bottom: .5rem; }
        h2 { color: #15BCDF; margin: 1rem 0 .5rem; font-size: 1.1rem; }
        .card { background: #161620; border: 1px solid #2a2a3a; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
        label { font-size: .8rem; color: #888; display: block; margin-bottom: .2rem; }
        input, textarea { width: 100%; background: #0a0a0f; border: 1px solid #2a2a3a; color: #e0e0e0; padding: .5rem; border-radius: 6px; font-size: .85rem; margin-bottom: .5rem; font-family: inherit; }
        textarea { resize: vertical; min-height: 50px; }
        button { background: #15BCDF; color: #fff; border: none; padding: .5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: .85rem; margin-right: .5rem; margin-top: .25rem; }
        button:hover { background: #0fa3c2; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        .note { padding: .5rem; border-radius: 6px; margin: .5rem 0; font-size: .8rem; }
        .note.ok { background: rgba(82,224,161,.15); color: #52e0a1; }
        .note.err { background: rgba(255,92,122,.15); color: #ff5c7a; }
        .note.warn { background: rgba(255,217,61,.15); color: #ffd93d; }
        .row { display: flex; gap: .5rem; flex-wrap: wrap; }
        .grant-item { background: #0a0a0f; border: 1px solid #2a2a3a; border-radius: 6px; padding: .75rem; margin-bottom: .5rem; cursor: pointer; }
        .grant-item:hover { border-color: #15BCDF; }
        pre { background: #0a0a0f; padding: .75rem; border-radius: 6px; overflow-x: auto; font-size: .75rem; }
        .badge { position: fixed; top: .5rem; right: .5rem; padding: .25rem .75rem; border-radius: 20px; font-size: .75rem; font-weight: 700; }
        .badge.conn { background: #52e0a1; color: #000; }
        .badge.disc { background: #ff5c7a; color: #fff; }
    </style>
</head>
<body>
<div class="wrap">
    <div id="badge" class="badge disc">Not Connected</div>
    <h1>GrantGuard v2</h1>
    
    <button id="walletBtn">Connect Wallet</button>
    
    <div id="appNote" class="note" style="display:none"></div>
    
    <div class="card">
        <h2>Available Grants</h2>
        <div id="grantsList"><p style="color:#888">Connect wallet to view grants</p></div>
    </div>
    
    <div class="card">
        <h2>Create Grant</h2>
        <label>Grant ID</label>
        <input type="text" id="c_id" value="test-grant-99">
        <label>Name</label>
        <input type="text" id="c_name" value="Test Grant">
        <label>Description</label>
        <textarea id="c_desc">Test Description</textarea>
        <label>Eligibility</label>
        <textarea id="c_elig">All developers</textarea>
        <label>Criteria</label>
        <textarea id="c_crit">Technical merit</textarea>
        <label>Budget Rules</label>
        <input type="text" id="c_budget" value="Max 1000 GEN">
        <label>Required Evidence</label>
        <input type="text" id="c_evid" value="GitHub repo">
        <label>Deadline</label>
        <input type="date" id="c_deadline" value="2026-12-31">
        <button id="b_create">Create Grant</button>
        <div id="o_create"></div>
    </div>
    
    <div class="card">
        <h2>Apply for Grant</h2>
        <label>Grant ID</label>
        <input type="text" id="a_grant" value="test-grant-1">
        <label>Project Name</label>
        <input type="text" id="a_name" value="My Project">
        <label>Description</label>
        <textarea id="a_desc">A test project</textarea>
        <label>Team Info</label>
        <input type="text" id="a_team" value="Solo developer">
        <label>Amount (wei)</label>
        <input type="text" id="a_amount" value="500000000000000000">
        <label>Website</label>
        <input type="text" id="a_web" value="https://example.com">
        <label>GitHub URL</label>
        <input type="text" id="a_gh" value="https://github.com/test">
        <label>Evidence URLs</label>
        <input type="text" id="a_evid" value="https://github.com/test">
        <label>Additional Info</label>
        <textarea id="a_info">Test info</textarea>
        <button id="b_apply">Submit Application</button>
        <div id="o_apply"></div>
    </div>
    
    <div class="card">
        <h2>Check Status</h2>
        <label>Application ID</label>
        <input type="text" id="s_id" value="app_0">
        <div class="row">
            <button id="b_check">Check Status</button>
            <button id="b_eval">Evaluate</button>
            <button id="b_release">Release Funds</button>
        </div>
        <div id="o_status" style="margin-top:.5rem"></div>
    </div>
</div>

<script>
const CHAIN = '0x107d';
const RPC = 'https://studio-next.genlayer.com/api';
const CONTRACT = '0x671990450Bab8f89144F50B6A619c6382E824172';
const CONSENSUS = '0xb7278A61aa25c888815aFC32Ad3cC52fF24fE575';
const API = window.location.origin.includes('localhost') ? 'http://localhost:3000' : 'https://grantguard-56ax.onrender.com';
const $ = x => document.getElementById(x);

let acct = null;

function showNote(m, t) { const e = $('appNote'); e.textContent = m; e.className = 'note show ' + t; e.style.display = 'block'; }
function hideNote() { $('appNote').style.display = 'none'; }
function showOut(id, m, err) { const e = $(id); e.textContent = m; e.className = 'note show ' + (err ? 'err' : 'ok'); }
function setBtn(on) { ['b_create','b_apply','b_check','b_eval','b_release'].forEach(i => { const b = $(i); if (b) b.disabled = !on; }); }
function updateBadge(cls, txt) { $('badge').className = 'badge ' + cls; $('badge').textContent = txt; }

async function rpc(method, params) {
    const r = await fetch(RPC, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ jsonrpc:'2.0', id: Date.now(), method, params }) });
    const j = await r.json();
    if (j.error) throw new Error(j.error.message);
    return j.result;
}

// API helpers
async function apiEncode(method, args) {
    const r = await fetch(API + '/api/encode', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ method, args })
    });
    if (!r.ok) throw new Error('Encoding failed: ' + r.statusText);
    return r.json();
}

async function apiSimulate(method, args) {
    const r = await fetch(API + '/api/simulate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ method, args, from: acct })
    });
    if (!r.ok) throw new Error('Simulation failed: ' + r.statusText);
    return r.json();
}

async function apiRead(method, args) {
    const r = await fetch(API + '/api/read', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ method, args })
    });
    if (!r.ok) throw new Error('Read failed: ' + r.statusText);
    return r.json();
}

async function connect() {
    if (!window.ethereum) { showNote('MetaMask not detected.', 'err'); throw new Error('No wallet'); }
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    if (!accounts || !accounts.length) throw new Error('No accounts');
    acct = accounts[0];
    const chain = await window.ethereum.request({ method: 'eth_chainId' });
    if (parseInt(chain, 16) !== 61997) {
        showNote('Switch to Studio Next...', 'warn');
        try { await window.ethereum.request({ method: 'wallet_addEthereumChain', params: [{ chainId: CHAIN, chainName: 'GenLayer Studio Next', rpcUrls: [RPC], nativeCurrency: { name: 'GEN', symbol: 'GEN', decimals: 18 } }] }); } catch(e) {}
        await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: CHAIN }] });
    }
    updateBadge('conn', `✓ ${acct.slice(0,6)}...${acct.slice(-4)}`);
    setBtn(true);
    $('walletBtn').textContent = 'Disconnect';
    hideNote();
    return acct;
}

function disconnect() { acct = null; updateBadge('disc', 'Disconnected'); setBtn(false); $('walletBtn').textContent = 'Connect Wallet'; $('grantsList').innerHTML = '<p style="color:#888">Connect wallet to view grants</p>'; }

// Send write transaction with simulation pre-flight
async function sendTx(method, args) {
    // Step 1: Encode
    const { data, to } = await apiEncode(method, args);
    
    // Step 2: Simulate (dry-run)
    const sim = await apiSimulate(method, args);
    if (!sim.success) {
        throw new Error('Simulation failed: ' + (sim.error || 'Unknown error'));
    }
    
    // Step 3: Send to consensus contract
    return await window.ethereum.request({ 
        method: 'eth_sendTransaction', 
        params: [{ 
            from: acct, 
            to: to,
            data, 
            value: '0x0',
            gas: '0x186a00'
        }] 
    });
}

async function loadGrants() {
    const listEl = $('grantsList');
    listEl.innerHTML = '<p style="color:#888">Loading grants...</p>';
    try {
        const ids = ['test-grant-1', 'test-grant-2', 'test-grant-3', 'grant_0', 'grant_1', 'grant_2'];
        let found = [];
        for (let i = 0; i < ids.length; i++) {
            try {
                const { result } = await apiRead('get_grant', [ids[i]]);
                if (result && result !== '0x' && result.length > 40) {
                    found.push({ id: ids[i], name: ids[i] });
                }
            } catch(e) {}
        }
        if (found.length === 0) { listEl.innerHTML = '<p style="color:#888">No grants found</p>'; return; }
        listEl.innerHTML = found.map(g => `<div class="grant-item" onclick="$('a_grant').value='${g.id}'"><strong>${g.name}</strong><br><small style="color:#888">ID: ${g.id}</small></div>`).join('');
    } catch (e) { listEl.innerHTML = '<p style="color:#888">Error: ' + e.message + '</p>'; }
}

// Event listeners
$('walletBtn').addEventListener('click', async () => { 
    if (acct) { disconnect(); return; } 
    try { 
        $('walletBtn').textContent = 'Connecting...'; 
        $('walletBtn').disabled = true; 
        showNote('Connecting...', 'warn'); 
        await connect(); 
        await loadGrants(); 
    } catch (err) { 
        showNote('Error: ' + err.message, 'err'); 
        $('walletBtn').textContent = 'Connect Wallet'; 
        $('walletBtn').disabled = false; 
    } 
});

$('b_create').addEventListener('click', async () => {
    try {
        hideNote();
        const args = [
            $('c_id').value,
            $('c_name').value,
            $('c_desc').value,
            $('c_elig').value,
            $('c_crit').value,
            $('c_budget').value,
            $('c_evid').value,
            $('c_deadline').value
        ];
        showOut('o_create', 'Simulating...', false);
        const hash = await sendTx('create_grant', args);
        showOut('o_create', `✅ Created!\nTx: ${hash}`, false);
    } catch (err) { showOut('o_create', 'Error: ' + err.message, true); }
});

$('b_apply').addEventListener('click', async () => {
    try {
        hideNote();
        const args = [
            $('a_grant').value,
            $('a_name').value,
            $('a_desc').value,
            $('a_team').value || '',
            $('a_amount').value || '0',
            $('a_web').value || '',
            $('a_gh').value || '',
            $('a_evid').value,
            $('a_info').value || ''
        ];
        showOut('o_apply', 'Simulating...', false);
        const hash = await sendTx('submit_application', args);
        showOut('o_apply', `✅ Submitted!\nTx: ${hash}`, false);
    } catch (err) { showOut('o_apply', 'Error: ' + err.message, true); }
});

$('b_check').addEventListener('click', async () => {
    try {
        hideNote();
        const id = $('s_id').value;
        const { result } = await apiRead('get_application', [id]);
        $('o_status').innerHTML = '<pre>' + result + '</pre>';
    } catch (err) { showOut('o_status', 'Error: ' + err.message, true); }
});

$('b_eval').addEventListener('click', async () => {
    try {
        hideNote();
        const id = $('s_id').value;
        showOut('o_status', 'Simulating...', false);
        const hash = await sendTx('evaluate_application', [id]);
        showOut('o_status', `✅ Evaluation started!\nTx: ${hash}`, false);
    } catch (err) { showOut('o_status', 'Error: ' + err.message, true); }
});

$('b_release').addEventListener('click', async () => {
    try {
        hideNote();
        const id = $('s_id').value;
        showOut('o_status', 'Simulating...', false);
        const hash = await sendTx('release_funds', [id]);
        showOut('o_status', `✅ Released!\nTx: ${hash}`, false);
    } catch (err) { showOut('o_status', 'Error: ' + err.message, true); }
});

if (window.ethereum) {
    window.ethereum.on('accountsChanged', function(a) { if (!a.length) disconnect(); });
}
</script>
</body>
</html>
