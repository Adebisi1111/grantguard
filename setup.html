<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Grant Setup</title>
    <script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; padding: 2rem; }
        .container { max-width: 600px; margin: 0 auto; }
        h1 { color: #15BCDF; margin-bottom: 1rem; }
        .btn { background: #15BCDF; color: #fff; border: none; padding: .8rem 1.5rem; border-radius: 8px; cursor: pointer; font-size: 1rem; margin: .5rem 0; }
        .btn:hover { background: #0fa3c2; }
        .note { border-radius: 8px; padding: .75rem; margin: 1rem 0; display: none; }
        .note.ok { background: rgba(82,224,161,.2); color: #52e0a1; }
        .note.err { background: rgba(255,92,122,.2); color: #ff5c7a; }
        input, textarea { width: 100%; background: #161620; border: 1px solid #2a2a3a; color: #e0e0e0; padding: .6rem; border-radius: 8px; margin-bottom: .5rem; }
        label { color: #888; font-size: .85rem; }
    </style>
</head>
<body>
<div class="container">
    <h1>Create Grant (Quick Setup)</h1>
    <button class="btn" onclick="connect()">Connect Wallet</button>
    <button class="btn" onclick="createGrant()">Create DeFi Grant</button>
    <button class="btn" onclick="fundGrant()">Fund Grant (1 GEN)</button>
    <div id="note" class="note"></div>
</div>

<script>
const CONTRACT = '0x671990450Bab8f89144F50B6A619c6382E824172';
const ABI = [
    "function create_grant(string,string,string,string,string,string,string,string) returns (string)",
    "function fund_grant(string) payable returns (string)"
];

var contract = null;

function note(msg, type) {
    var el = document.getElementById('note');
    el.textContent = msg;
    el.className = 'note ' + type;
    el.style.display = 'block';
}

async function connect() {
    try {
        var ethers = window.ethers;
        var provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        var signer = provider.getSigner();
        contract = new ethers.Contract(CONTRACT, ABI, signer);
        note('Connected!', 'ok');
    } catch (e) { note('Error: ' + e.message, 'err'); }
}

async function createGrant() {
    if (!contract) { note('Connect wallet first!', 'err'); return; }
    try {
        var tx = await contract.create_grant(
            'defi-grant-1',
            'DeFi Innovation Grant',
            'Supporting DeFi projects',
            'Open to all developers',
            'Technical merit and innovation',
            'Max 10000 GEN per project',
            'GitHub repo with working demo',
            '2026-12-31'
        );
        note('Grant created! TX: ' + tx.hash, 'ok');
    } catch (e) { note('Error: ' + e.message, 'err'); }
}

async function fundGrant() {
    if (!contract) { note('Connect wallet first!', 'err'); return; }
    try {
        var tx = await contract.fund_grant('defi-grant-1', { value: '1000000000000000000' });
        note('Funded! TX: ' + tx.hash, 'ok');
    } catch (e) { note('Error: ' + e.message, 'err'); }
}
</script>
</body>
</html>
